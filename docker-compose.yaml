services:
  builder:
    image: frostlab/cougars:runtime-latest
    container_name: cougars-builder-ct
    profiles: ["build"]
    volumes:
      - ./ros2_ws:/ros2_ws
    command: colcon build --cmake-args -DCMAKE_BUILD_TYPE=Release

  router:
    image: frostlab/cougars:runtime-latest
    container_name: cougars-router-ct
    network_mode: host
    ipc: host
    pid: host
    environment:
      - ZENOH_CONFIG_OVERRIDE=connect/endpoints=["tcp/${ZENOH_ROUTER_IP}:7447"]
    restart: unless-stopped
    command: ros2 run rmw_zenoh_cpp rmw_zenohd

  runtime:
    image: frostlab/cougars:runtime-latest
    # build:
    #   context: .
    #   dockerfile: .docker/Dockerfile.runtime
    container_name: cougars-runtime-ct
    network_mode: host
    ipc: host
    pid: host
    privileged: true
    depends_on:
      - router
    environment:
      - RMW_IMPLEMENTATION=rmw_zenoh_cpp
      - ROS_DOMAIN_ID=24
    volumes:
      - ./ros2_ws:/ros2_ws
      - ./config:/config
      - ./bags:/bags
      - /etc/localtime:/etc/localtime:ro
      - /run/udev:/run/udev:ro
      - /dev:/dev
    restart: unless-stopped
    command: >
      ros2 launch coug_bringup agent.launch.py
      agent_ns:=${AGENT_NS}
      use_sim_time:=${USE_SIM_TIME:-false}
