services:
  dev:
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all

  holoocean:
    image: frostlab/holoocean:2.0-runtime-ubuntu24.04-cuda12.9-ros-uid
    build:
      context: ..
      dockerfile: .docker/holoocean/Dockerfile.holoocean
    container_name: cougars-holoocean-ct
    network_mode: host
    ipc: host
    pid: host
    depends_on:
      - router
    runtime: nvidia
    environment:
      - DISPLAY=${DISPLAY}
      - RMW_IMPLEMENTATION=rmw_zenoh_cpp
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - ROS_DOMAIN_ID=24
    volumes:
      - ../config:/home/ue4/config
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /etc/localtime:/etc/localtime:ro
      - /dev/shm:/dev/shm
    stdin_open: true
    tty: true
    restart: unless-stopped
