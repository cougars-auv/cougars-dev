services:
  gtsam:
    image: frostlab/cougars:gtsam-${VERSION:-latest}
    build:
      context: ..
      dockerfile: .docker/Dockerfile.gtsam
    profiles: ["build-reqs"]

  base:
    image: frostlab/cougars:base-${VERSION:-latest}
    build:
      context: ..
      dockerfile: .docker/Dockerfile.base
      args:
        - VERSION=${VERSION:-latest}
    profiles: ["build-reqs"]

  mapproxy:
    image: danielsnider/mapproxy
    container_name: mapproxy-ct
    network_mode: host
    volumes:
      - ../.mapproxy:/mapproxy
    restart: unless-stopped

  maptiles:
    build: https://github.com/cougars-auv/MapTilesDownloader.git#master
    container_name: maptiles-ct
    ports:
      - "8081:8080"
    volumes:
      - ../.mapproxy/cache_data/gm_cache_EPSG900913:/app/output
    restart: unless-stopped

  router:
    image: frostlab/cougars:base-${VERSION:-latest}
    pull_policy: always
    container_name: router-ct
    network_mode: host
    ipc: host
    pid: host
    restart: unless-stopped
    command: ros2 run rmw_zenoh_cpp rmw_zenohd

  dev:
    image: frostlab/cougars:dev-${VERSION:-latest}
    pull_policy: always
    # build:
    #   context: ..
    #   dockerfile: .docker/Dockerfile.dev
    #   args:
    #     - VERSION=${VERSION:-latest}
    container_name: cougars-ct
    network_mode: host
    ipc: host
    pid: host
    privileged: true
    depends_on:
      - router
    environment:
      - DISPLAY=${DISPLAY}
      - RMW_IMPLEMENTATION=rmw_zenoh_cpp
      - ROS_DOMAIN_ID=24
    volumes:
      - ..:/home/frostlab-docker/cougars-dev
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /etc/localtime:/etc/localtime:ro
      - /run/udev:/run/udev:ro
      - /dev:/dev
    stdin_open: true
    tty: true
    restart: unless-stopped
