session_name: auv-launch
start_directory: "~/cougars-dev"
options:
  mouse: on
shell_command_before:
  - pull_all() { for r in $(find ~/cougars-dev -name .git -prune -printf '%h\n'); do (cd "$r"; b=$(git branch --show-current); echo "=== $r ($b) ==="; git pull "$1" "$b"); done; }
  - alias pull="pull_all origin"
  - alias pull-base="pull_all base"
  - alias restart="sudo systemctl restart cougars.service && sudo journalctl -u cougars.service -f"
  - alias logs="docker logs -f runtime-ct"
windows:
  - window_name: main
    layout: main-vertical
    panes:
      - shell_command:
          - logs
      - shell_command:
          - cmd: restart
            enter: false
      - shell_command:
          - cmd: pull-base
            enter: false
