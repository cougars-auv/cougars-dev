/**:
  cmd_vel_converter_node:
    ros__parameters:
      # --- Node Settings ---
      agent_type: "bluerov2"

      # --- ROS Topics ---
      input_topic: "cmd_vel_out"
      output_topic: "/command/agent"

  depth_camera_converter_node:
    ros__parameters:
      # --- Node Settings ---
      sync_slop_sec: 0.05 # [s] Max stamp difference to sync the depth, info and color messages.
      stamp_offset_sec: 0.2 # [s] Render age at handover, ~TicksPerCapture / ticks_per_sec.
      min_range: 0.2 # [m] Depth readings below this are marked invalid (NaN).
      max_range: 20.0 # [m] Depth readings above this are marked invalid (NaN).

      # --- ROS Topics and Frames ---
      color_input_topic: "RGBCameraDepth"
      depth_input_topic: "DepthCameraDepth"
      info_input_topic: "DepthCameraInfo"
      color_output_topic: "camera/rgb/image_rect_color"
      color_info_output_topic: "camera/rgb/camera_info"
      depth_output_topic: "camera/depth/depth_registered"
      depth_info_output_topic: "camera/depth/camera_info"

  depth_converter_node:
    ros__parameters:
      # --- Node Settings ---
      # https://www.te.com/commerce/DocumentDelivery/DDEController?Action=srchrtrv&DocNm=MS5837-02BA01&DocType=DS&DocLang=English
      noise_sigma: 0.02 # [m] Depth sensor Z-position uncertainty sigma.

      # --- ROS Topics and Frames ---
      input_topic: "DepthSensor"
      output_topic: "depth/odometry_null"

  dvl_converter_node:
    ros__parameters:
      # --- Node Settings ---
      # https://waterlinked.com/dvl-a50
      beam_velocity_noise_sigma: 0.011 # [m/s] Per-beam radial velocity uncertainty sigma.
      range_noise_sigma: 0.1 # [m] Per-beam range uncertainty sigma.

      # IMPORTANT! This must match HoloOcean's MaxRange for the DVLSensor.
      max_range: 500.0 # [m] Beams at or beyond this are reported lost.

      # --- ROS Topics and Frames ---
      velocity_input_topic: "DVLSensorVelocity"
      range_input_topic: "DVLSensorRange"
      output_topic: "dvl/data"
      config_command_topic: "dvl/config/command"

  dvl_odom_converter_node:
    ros__parameters:
      # --- Node Settings ---
      # https://waterlinked.com/dvl-a50
      noise_sigma_scale: 0.0101 # [m/m] Dead-reckoning position uncertainty sigma per meter traveled.
      # https://docs.waterlinked.com/dvl/dead-reckoning/
      yaw_drift_sigma: 0.3 # [deg/min] Dead-reckoning yaw drift rate sigma.

      tf_timeout_sec: 0.1 # [s] How long to wait for the map transform.

      # --- ROS Topics and Frames ---
      input_topic: "DynamicsSensorOdom"
      output_topic: "dvl/position"
      config_command_topic: "dvl/config/command"

  fin_state_publisher_node:
    ros__parameters:
      input_topic: "ControlCommand"
      output_topic: "joint_states"

  gps_converter_node:
    ros__parameters:
      # --- Node Settings ---
      origin_latitude: 40.33940
      origin_longitude: -111.90721
      origin_altitude: 1412.0

      # https://support.sbg-systems.com/sc/el/latest/ellipse-documentation/hardware-documentation/aiding-sensors
      noise_sigmas: [0.015, 0.015, 0.025] # [east, north, up] [m] GPS position uncertainty sigmas.

      # --- ROS Topics and Frames ---
      input_topic: "GPSSensor"
      output_topic: "gps/fix"

  hsd_converter_node:
    ros__parameters:
      hsd_topic: "cmd_hsd"
      output_heading_topic: "/heading"
      output_speed_topic: "/speed"
      output_depth_topic: "/depth"

  imu_converter_node:
    ros__parameters:
      # --- Node Settings ---
      sync_slop_sec: 0.05 # [s] Max stamp difference to sync the IMU and AHRS messages.

      # 57 µg/√Hz -> 5.6e-4 m/s^2/√Hz * √200 Hz -> 7.9e-3 m/s^2
      # 0.18 °/√h -> 3.0e-3 °/s/√Hz * √200 Hz -> 7.4e-4 rad/s
      # https://github.com/SBG-Systems/sbg_ros2_driver/blob/3.4.0/config/sbg_device_uart_default.yaml
      # https://support.sbg-systems.com/sc/el/latest/ellipse-documentation/performance-specifications
      accel_noise_sigmas: [7.9e-3, 7.9e-3, 7.9e-3] # [m/s^2] Accelerometer measurement noise sigmas.
      gyro_noise_sigmas: [7.4e-4, 7.4e-4, 7.4e-4] # [rad/s] Gyroscope measurement noise sigmas.
      # https://support.sbg-systems.com/sc/el/latest/ellipse-documentation/performance-specifications
      ahrs_noise_sigmas: [0.00698, 0.00698, 0.01745] # [roll, pitch, yaw] [rad] AHRS orientation uncertainty sigmas.
      # Gauss-Markov fit K ≈ 2.3 * B / √tau_c at tau_c = 500 s.
      # https://support.sbg-systems.com/sc/el/latest/ellipse-documentation/performance-specifications
      accel_bias_rw_sigmas: [1.4e-5, 1.4e-5, 1.4e-5] # [m/s^2/√s] Continuous-time accel bias random walk spectral density sigmas.
      gyro_bias_rw_sigmas: [3.5e-6, 3.5e-6, 3.5e-6] # [rad/s/√s] Continuous-time gyro bias random walk spectral density sigmas.

      # --- ROS Topics and Frames ---
      imu_input_topic: "IMUSensor"
      ahrs_input_topic: "RotationSensor"
      output_topic: "imu/data"
      bias_topic: "imu/bias"

  mag_converter_node:
    ros__parameters:
      # --- Node Settings ---
      # IMPORTANT! This must match sbg_imu_mag_node's au_to_tesla.
      au_to_tesla: 5.0446e-05

      # https://support.sbg-systems.com/sc/el/latest/ellipse-documentation/hardware-documentation/aiding-sensors
      noise_sigmas: [3.0e-07, 3.0e-07, 3.0e-07] # [T] Magnetic field uncertainty sigmas.
      # No published SBG hard-iron spec; assumes ~20% of the local field magnitude.
      bias_sigmas: [1.0e-05, 1.0e-05, 1.0e-05] # [T] Hard-iron bias sigmas.

      # --- ROS Topics and Frames ---
      input_topic: "MagnetometerSensor"
      output_topic: "imu/mag_au"
      bias_topic: "imu/mag/bias"

  modem_converter_node:
    ros__parameters:
      # --- Node Settings ---
      tick_period_sec: 0.1 # [s] Timer period for servicing the send queue.
      send_delay_sec: 0.4 # [s] Channel busy time after each transmission.
      resp_delay_sec: 0.0 # [s] Delay before answering a REQ with its RESP.
      resp_timeout_sec: 4.0 # [s] How long to wait for a RESP before timing out.
      beacon_id: 1

      # https://www.blueprintsubsea.com/seatrac/seatrac-standard
      bearing_noise_sigmas: [0.01745, 0.01745] # [azimuth, elevation] [rad] Bearing uncertainty sigmas.
      range_noise_sigma: 0.1 # [m] Two-way time-of-flight range uncertainty sigma.

      # --- ROS Topics and Frames ---
      beacon_rec_topic: "AcousticBeaconSensor"
      beacon_send_topic: "/acoustic_beacon_send"
      modem_rec_topic: "modem_rec"
      modem_send_topic: "modem_send"
      modem_cmd_update_topic: "modem_cmd_update"
      depth_topic: "modem/depth/odometry"

  modem_depth_converter_node:
    ros__parameters:
      # --- Node Settings ---
      # https://www.blueprintsubsea.com/downloads/seatrac/UM-140-D00221-13.pdf
      noise_sigma: 0.1 # [m] Depth sensor Z-position uncertainty sigma.

      # --- ROS Topics and Frames ---
      input_topic: "ModemDepthSensor"
      output_topic: "modem/depth/odometry"

  modem_imu_converter_node:
    ros__parameters:
      # --- Node Settings ---
      sync_slop_sec: 0.05 # [s] Max stamp difference to sync the IMU and AHRS messages.

      # 57 µg/√Hz -> 5.6e-4 m/s^2/√Hz * √10 Hz -> 1.8e-3 m/s^2
      # 0.18 °/√h -> 3.0e-3 °/s/√Hz * √10 Hz -> 1.7e-4 rad/s
      # https://support.sbg-systems.com/sc/el/latest/ellipse-documentation/performance-specifications
      accel_noise_sigmas: [1.8e-3, 1.8e-3, 1.8e-3] # [m/s^2] Accelerometer measurement noise sigmas.
      gyro_noise_sigmas: [1.7e-4, 1.7e-4, 1.7e-4] # [rad/s] Gyroscope measurement noise sigmas.
      # https://www.blueprintsubsea.com/seatrac/seatrac-standard
      ahrs_noise_sigmas: [0.00349, 0.00349, 0.01745] # [roll, pitch, yaw] [rad] AHRS orientation uncertainty sigmas.
      # Gauss-Markov fit K ≈ 2.3 * B / √tau_c at tau_c = 500 s.
      # https://support.sbg-systems.com/sc/el/latest/ellipse-documentation/performance-specifications
      accel_bias_rw_sigmas: [1.4e-5, 1.4e-5, 1.4e-5] # [m/s^2/√s] Continuous-time accel bias random walk spectral density sigmas.
      gyro_bias_rw_sigmas: [3.5e-6, 3.5e-6, 3.5e-6] # [rad/s/√s] Continuous-time gyro bias random walk spectral density sigmas.

      # --- ROS Topics and Frames ---
      imu_input_topic: "ModemIMUSensor"
      ahrs_input_topic: "ModemRotationSensor"
      output_topic: "modem/imu/data"
      bias_topic: "modem/imu/bias"

  modem_status_converter_node:
    ros__parameters:
      # --- Node Settings ---
      sync_slop_sec: 0.05 # [s] Max stamp difference to sync the IMU and depth messages.

      # -- ROS Topics and Frames ---
      imu_input_topic: "modem/imu/data"
      depth_input_topic: "modem/depth/odometry"
      output_topic: "modem_status"

  pressure_converter_node:
    ros__parameters:
      # --- Node Settings ---
      water_density: 997.0 # [kg/m^3]
      gravity: 9.81 # [m/s^2]
      atmospheric_pressure: 101325.0 # [Pa]

      # https://www.te.com/commerce/DocumentDelivery/DDEController?Action=srchrtrv&DocNm=MS5837-02BA01&DocType=DS&DocLang=English
      noise_sigma: 195.61 # [Pa]

      # --- ROS Topics and Frames ---
      input_topic: "DepthSensor"
      output_topic: "pressure/data"

  stereo_converter_node:
    ros__parameters:
      # --- Node Settings ---
      sync_slop_sec: 0.05 # [s] Max stamp difference to sync the stereo images.

      # --- ROS Topics and Frames ---
      front_input_topic: "RGBCameraFront"
      back_input_topic: "RGBCameraBack"
      front_output_topic: "stereo/front/image_raw"
      back_output_topic: "stereo/back/image_raw"
      front_stereo_info_topic: "stereo/front/camera_info"
      back_stereo_info_topic: "stereo/back/camera_info"

  truth_converter_node:
    ros__parameters:
      # --- Node Settings ---
      publish_tf: false # Whether to publish the map->base_link transform
      tf_timeout_sec: 0.1 # [s] How long to wait for the map transform.

      # --- ROS Topics and Frames ---
      input_topic: "DynamicsSensorOdom"
      output_topic: "odometry/truth"

  wrench_converter_node:
    ros__parameters:
      control_topic: "ControlCommand"
      odom_topic: "DynamicsSensorOdom"
      wrench_raw_topic: "cmd_wrench_raw"
      wrench_topic: "cmd_wrench"
