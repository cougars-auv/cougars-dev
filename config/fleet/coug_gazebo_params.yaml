/**:
  coug_gazebo_agent_launch:
    ros__parameters:
      urdf_file: "rover.gazebo.xacro"
      dem_file: ""

  coug_gazebo_world_launch:
    ros__parameters:
      world_file: "sonoma_raceway.sdf.xacro"

  dem_global_costmap_node:
    ros__parameters:
      # --- Node Settings ---
      max_slope_degrees: 25.0
      resolution: 1.0 # [m]
      outside_is_lethal: false

      # --- ROS Topics and Frames ---
      origin_topic: "/origin"
      output_topic: "terrain/occupancy"

  imu_covariance_node:
    ros__parameters:
      # --- Node Settings ---
      enable_orientation: false
      orientation_noise_sigmas: [0.05, 0.05, 0.05] # [roll, pitch, yaw] [rad]

      # --- ROS Topics ---
      input_topic: "camera/imu/data_gz"
      output_topic: "camera/imu/data_raw"

  mag_covariance_node:
    ros__parameters:
      # --- Node Settings ---
      magnetic_field_noise_sigmas: [3.0e-7, 3.0e-7, 3.0e-7] # [x, y, z] [T]

      # --- ROS Topics ---
      input_topic: "camera/imu/mag_gz"
      output_topic: "camera/imu/mag"

  navsat_covariance_node:
    ros__parameters:
      # --- Node Settings ---
      position_noise_sigmas: [0.015, 0.015, 0.025] # [east, north, up] [m]

      # --- ROS Topics ---
      input_topic: "gps/fix_gz"
      output_topic: "gps/fix"

  rgb_camera_info_relay:
    ros__parameters:
      input_topic: "camera/depth/camera_info"
      output_topic: "camera/rgb/camera_info"
