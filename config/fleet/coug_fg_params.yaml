/**:
  ros__parameters:
    # --- Node Settings ---
    publish_global_tf: true # Publish the map -> odom transform.
    publish_neighbor_global_tf: true # Publish the map -> neighbor base transforms.
    publish_smoothed_path: true # Publish the full smoothed path for visualization.
    publish_velocity: true # Publish the estimated velocity (of the target frame in the map frame).
    publish_imu_bias: true # Publish the estimated IMU biases (accel + gyro).
    publish_mag_bias: true # Publish the estimated magnetometer hard-iron bias.
    publish_diagnostics: true # Publish diagnostic information.
    publish_graph_metrics: true # Publish high-frequency timing and graph metadata.

    # These are computationally expensive to calculate, so disable if not needed.
    publish_pose_cov: true # Publish the pose covariance.
    publish_neighbor_pose_cov: true # Publish the neighbor agent pose covariances.
    publish_velocity_cov: false # Publish the velocity covariance.
    publish_imu_bias_cov: false # Publish the IMU bias covariance.
    publish_mag_bias_cov: false # Publish the magnetometer hard-iron bias covariance.

    # --- GTSAM Smoother Settings ---
    #
    # Solver Types:
    # - "IncrementalFixedLagSmoother": Incremental fixed-lag smoothing. (default)
    # - "ISAM2": Incremental full trajectory smoothing.
    # - "LevenbergMarquardt": Batch full trajectory smoothing.

    solver_type: "IncrementalFixedLagSmoother"
    max_update_rate_hz: -1.0 # [Hz] Maximum keyframe rate. -1.0 for no limit.
    max_opt_rate_hz: -1.0 # [Hz] Maximum optimization rate. -1.0 for no limit.
    smoother_lag_sec: 20.0 # [s] Time window of past states to smooth over.
    relinearize_threshold: 0.1 # Lower values are more accurate but slower.
    relinearize_skip: 1 # Number of updates to skip between relinearizations.

    # --- Keyframe Settings ---
    #
    # Keyframe Sources:
    # - "DVL": Trigger keyframes when DVL data arrives. (default)
    # - "Depth": Trigger keyframes when depth data arrives.
    # - "Timer": Trigger keyframes periodically at keyframe_timer_hz.
    # - "None": Disable the keyframe trigger block.

    keyframe_source: "DVL"
    backup_keyframe_source: "Depth" # Fallback source if the primary source drops out.
    keyframe_timeout_sec: 0.5 # [s] Time before determining the primary source has dropped out.
    keyframe_timer_hz: 10.0 # [Hz] Rate of the periodic keyframe timer (if "Timer" is used).
    min_keyframe_interval_sec: 0.02 # [s] Minimum time between consecutive keyframes.

    # --- ROS Topics and Frames ---
    imu_topic: "imu/data"
    gps_odom_topic: "gps/odometry"
    depth_odom_topic: "depth/odometry"
    mag_topic: "imu/mag"
    ahrs_topic: "imu/data"
    dvl_topic: "dvl/twist"
    wrench_topic: "cmd_wrench"
    global_odom_topic: "odometry/global"
    smoothed_path_topic: "smoothed_path"
    velocity_topic: "~/velocity" # At the target frame in the map frame.
    # Topic for the IMU bias. Published as a TwistWithCovarianceStamped,
    # where 'linear' holds accelerometer bias and 'angular' holds gyroscope bias.
    # Preserves accel/gyro cross-covariance; sensor_msgs/Imu has no field for that.
    imu_bias_topic: "~/imu/bias"
    mag_bias_topic: "~/imu/mag/bias"
    graph_metrics_topic: "~/metrics"
    reset_service: "~/reset"

    multiagent_namespaces: ["coug2sim", "coug3sim"]
    multiagent_status_topic: "base/agent/status" # Prefixed with neighbor namespace.
    multiagent_global_odom_topic: "base/odometry/global_nbr" # Prefixed with neighbor namespace.

    # --- Factor Settings ---
    #
    # Robust Kernels:
    # - "None": Standard Least Squares (Gaussian). Sensitive to outliers. (default)
    # - "Huber": Linear penalty for large errors. Good general robustness. (k=1.345 standard)
    # - "Tukey": Ignores large errors completely. Best for sensors with distinct 'bad' readings. (k=4.685 standard)

    base:
      use_parameter_tf: false
      parameter_tf: # Relative to the target frame.
        position: [0.0, 0.0, 0.0] # [x, y, z]
        orientation: [0.0, 0.0, 0.0, 1.0] # [qx, qy, qz, qw]

    imu:
      use_parameter_frame: false
      use_parameter_tf: false
      parameter_tf: # Relative to the target frame.
        position: [0.0, 0.0, 0.0] # [x, y, z]
        orientation: [0.0, 0.0, 0.0, 1.0] # [qx, qy, qz, qw]
      covariance_scalar: 1.0 # Applies to both sensor-reported and parameter_covariance values.
      # Used to convert between sensor-reported discrete covariances and continuous-time densities.
      sensor_rate_hz: 200.0 # [Hz] IMU output rate (SBG log_imu_data: 1 = 200 Hz).
      use_parameter_covariance: false
      parameter_covariance:
        # SBG Ellipse-N: 57 µg/√Hz accel, 0.18 °/√h gyro noise density.
        # https://support.sbg-systems.com/sc/el/latest/ellipse-documentation/performance-specifications
        accel_noise_sigmas: [5.6e-4, 5.6e-4, 5.6e-4] # [m/s^2/√Hz] Accelerometer noise density sigmas.
        gyro_noise_sigmas: [5.24e-5, 5.24e-5, 5.24e-5] # [rad/s/√Hz] Gyroscope noise density sigmas.
      # Derived from the SBG Ellipse-N in-run bias instabilities (14 µg accel, 7 °/h gyro).
      # https://support.sbg-systems.com/sc/el/latest/ellipse-documentation/performance-specifications
      # Gauss-Markov fit K ≈ 2.3 * B / √tau_c at tau_c = 500 s.
      accel_bias_rw_sigmas: [1.4e-5, 1.4e-5, 1.4e-5] # [m/s^2/√s] Continuous-time spectral density sigmas for accelerometer bias random walk.
      gyro_bias_rw_sigmas: [3.5e-6, 3.5e-6, 3.5e-6] # [rad/s/√s] Continuous-time spectral density sigmas for gyroscope bias random walk.
      integration_covariance: 1.0e-8 # A small covariance for the integration process itself.
      gravity: [0.0, 0.0, -9.8] # [m/s^2] HoloOcean gravity vector.
      diagnostic_timeout_sec: 1.0 # [s]

    gps:
      enable_gps: true
      enable_gps_init_priors: true
      use_parameter_frame: false
      use_parameter_tf: false
      parameter_tf: # Relative to the target frame.
        position: [0.0, 0.0, 0.0] # [x, y, z]
        orientation: [0.0, 0.0, 0.0, 1.0] # [qx, qy, qz, qw]
      covariance_scalar: 1.0 # Applies to both sensor-reported and parameter_covariance values.
      use_parameter_covariance: false
      parameter_covariance:
        # SBG Ellipse-N internal GNSS, RTK: 1 cm + 1 ppm horizontal position accuracy.
        # https://www.sbg-systems.com/ins/ellipse-n/
        position_noise_sigmas: [0.015, 0.015] # [east, north] [m] GPS position uncertainty sigmas.
      diagnostic_timeout_sec: 2.0 # [s]
      robust_kernel: "None"
      robust_k: 1.345

    depth:
      enable_depth: true
      enable_depth_init_priors: true
      use_parameter_frame: false
      use_parameter_tf: false
      parameter_tf: # Relative to the target frame.
        position: [0.0, 0.0, 0.0] # [x, y, z]
        orientation: [0.0, 0.0, 0.0, 1.0] # [qx, qy, qz, qw]
      covariance_scalar: 1.0 # Applies to both sensor-reported and parameter_covariance values.
      use_parameter_covariance: false
      parameter_covariance:
        # TE MS5837-02BA (Bar02): ±2 mbar (~2 cm H2O) accuracy over 0-60 °C.
        # https://www.te.com/en/product-CAT-BLPS0059.html
        position_z_noise_sigma: 0.02 # [m] Depth sensor Z-position uncertainty sigma.
      diagnostic_timeout_sec: 1.0 # [s]
      robust_kernel: "None"
      robust_k: 1.345

    mag:
      enable_mag: true
      estimate_hard_iron_bias: true # Estimate a constant hard iron bias.
      use_parameter_frame: false
      use_parameter_tf: false
      parameter_tf: # Relative to the target frame.
        position: [0.0, 0.0, 0.0] # [x, y, z]
        orientation: [0.0, 0.0, 0.0, 1.0] # [qx, qy, qz, qw]
      covariance_scalar: 1.0 # Applies to both sensor-reported and parameter_covariance values.
      use_parameter_covariance: false
      parameter_covariance:
        # SBG Ellipse magnetometer: 3 mGauss RMS noise -> 3e-07 T.
        # https://support.sbg-systems.com/sc/el/latest/ellipse-documentation/hardware-documentation/aiding-sensors
        magnetic_field_noise_sigmas: [3.0e-07, 3.0e-07, 3.0e-07] # [T] Magnetic field uncertainty sigmas.
      # https://www.ngdc.noaa.gov/geomag/calculators/magcalc.shtml#igrfwmm
      # WMMHR-2025 (40.2406 N, 111.741 W, 2026-01-23)
      # North: 20,842.3 nT, East: 3,963.4 nT, Vertical: 45,767.8 nT
      # NED: [X, Y, Z] -> ENU: [Y, X, -Z]
      reference_field: [3.9634e-06, 2.08423e-05, -4.57678e-05] # [T]
      diagnostic_timeout_sec: 1.0 # [s]
      robust_kernel: "None"
      robust_k: 1.345

    ahrs:
      enable_ahrs: false
      enable_ahrs_init_priors: true
      constrain_yaw_only: true # Constrain yaw only (roll/pitch left to IMU preintegration)
      use_parameter_frame: false
      use_parameter_tf: false
      parameter_tf: # Relative to the target frame.
        position: [0.0, 0.0, 0.0] # [x, y, z]
        orientation: [0.0, 0.0, 0.0, 1.0] # [qx, qy, qz, qw]
      covariance_scalar: 1.0 # Applies to both sensor-reported and parameter_covariance values.
      use_parameter_covariance: false
      parameter_covariance:
        # SBG Ellipse-N AHRS: 0.4° roll/pitch, 1.0° magnetic heading (typical dynamics).
        # https://support.sbg-systems.com/sc/el/latest/ellipse-documentation/performance-specifications
        orientation_noise_sigmas: [0.00698, 0.00698, 0.01745] # [roll, pitch, yaw] [rad] AHRS orientation uncertainty sigmas.
      # East-positive declination (NOAA convention).
      # https://www.ngdc.noaa.gov/geomag/calculators/magcalc.shtml#declination
      mag_declination_radians: 0.0 # [rad]
      diagnostic_timeout_sec: 1.0 # [s]
      robust_kernel: "None"
      robust_k: 1.345

    dvl:
      enable_dvl: true
      enable_dvl_init_priors: true
      use_parameter_frame: false
      use_parameter_tf: false
      parameter_tf: # Relative to the target frame.
        position: [0.0, 0.0, 0.0] # [x, y, z]
        orientation: [0.0, 0.0, 0.0, 1.0] # [qx, qy, qz, qw]
      covariance_scalar: 1.0 # Applies to both sensor-reported and parameter_covariance values.
      use_parameter_covariance: false
      parameter_covariance:
        # Water Linked DVL A50: ±1.01% long-term velocity accuracy (~0.01 m/s at 1 m/s).
        # https://waterlinked.com/dvl-a50
        velocity_noise_sigmas: [0.02, 0.02, 0.02] # [m/s] DVL body-velocity uncertainty sigmas.
      diagnostic_timeout_sec: 0.25 # [s]
      robust_kernel: "None"
      robust_k: 1.345

    const_vel:
      enable_const_vel: false
      enable_const_vel_dropout_only: false
      covariance_scalar: 1.0 # Scales the prediction noise sigmas.
      prediction_noise_sigmas: [0.001, 0.001, 0.001] # [m/s/sqrt(s)] Velocity prediction uncertainty sigmas.
      robust_kernel: "None"
      robust_k: 1.345

    wrench:
      enable_wrench: false
      enable_wrench_dropout_only: false
      use_parameter_frame: false
      use_parameter_tf: false
      parameter_tf: # Relative to the target frame.
        position: [0.0, 0.0, 0.0] # [x, y, z]
        orientation: [0.0, 0.0, 0.0, 1.0] # [qx, qy, qz, qw]
      covariance_scalar: 1.0 # Scales the prediction noise sigmas.
      prediction_noise_sigmas: [0.1, 0.1, 0.1] # [m/s/sqrt(s)] Model prediction uncertainty sigmas.
      mass: [31.87, 60.46, 60.46] # [kg] Mass of the AUV (diagonal)
      linear_drag: [1.59, 3.02, 3.02] # Linear drag coefficient (diagonal)
      quad_drag: [6.11, 196.13, 196.13] # Quadratic drag coefficient (diagonal)
      diagnostic_timeout_sec: 1.0 # [s]
      robust_kernel: "None"
      robust_k: 1.345

    multiagent:
      enable_multiagent: false
      estimate_origin_delta: false # Estimate each neighbor's map-frame offset.
      use_parameter_frame: false
      use_parameter_tf: false
      parameter_tf: # Relative to the target frame.
        position: [0.0, 0.0, 0.0] # [x, y, z]
        orientation: [0.0, 0.0, 0.0, 1.0] # [qx, qy, qz, qw]
      covariance_scalar: 1.0 # Scales the bearing and range noise sigmas.
      enable_bearing: true
      # Blueprint Subsea SeaTrac X150 USBL: ±1° angular accuracy (typ. 2% of acoustic range).
      # https://www.blueprintsubsea.com/seatrac/seatrac-standard
      bearing_noise_sigmas: [0.01745, 0.01745] # [azimuth, elevation] [rad] Bearing uncertainty sigmas.
      enable_range: true
      # Blueprint Subsea SeaTrac X150 USBL: ±0.1 m range accuracy (dependent on VOS accuracy).
      # https://www.blueprintsubsea.com/seatrac/seatrac-standard
      range_noise_sigma: 0.1 # [m] Two-way time-of-flight range uncertainty sigma.
      sound_speed: 1500.0 # [m/s] HoloOcean speed of sound.
      neighbor:
        modem_tf: # Relative to the neighboring agent's base frame.
          position: [0.3785, 0.0, -0.0985] # [x, y, z]
          orientation: [0.0, 0.0, 0.0, 1.0] # [qx, qy, qz, qw]
        ahrs: # Transformed into the neighboring agent's base frame.
          enable_ahrs: true
          covariance_scalar: 1.0 # Scales the orientation noise sigmas.
          # Blueprint Subsea SeaTrac X150 AHRS: ±0.2° pitch/roll, ±1.0° yaw standard deviation.
          # https://www.blueprintsubsea.com/seatrac/seatrac-standard
          orientation_noise_sigmas: [0.00349, 0.00349, 0.01745] # [roll, pitch, yaw] [rad] AHRS orientation uncertainty sigmas.
          # East-positive declination (NOAA convention).
          # https://www.ngdc.noaa.gov/geomag/calculators/magcalc.shtml#declination
          mag_declination_radians: 0.0 # [rad]
          robust_kernel: "None"
          robust_k: 1.345
        depth: # Transformed into the neighboring agent's base frame.
          enable_depth: true
          covariance_scalar: 1.0 # Scales the position z noise sigma.
          # SeaTrac X150 depth telemetry resolution: 0.1 m (SeaTrac Developer Guide UM-140).
          # https://www.blueprintsubsea.com/seatrac/support
          position_z_noise_sigma: 0.1 # [m] Depth sensor Z-position uncertainty sigma.
          robust_kernel: "None"
          robust_k: 1.345
      diagnostic_timeout_sec: 1.0 # [s]
      robust_kernel: "None"
      robust_k: 1.345

    # --- Initial State Priors ---
    priors:
      # If true, forces the initial state to be set by the values below.
      # Also overrides use_parameter_priors_covariance to set it to true.
      use_parameter_priors: true
      parameter_priors:
        initial_position: [0.0, 0.0, 0.0] # [m] (of the base frame in the map frame)
        initial_orientation: [0.0, 0.0, 0.0] # [roll, pitch, yaw] [rad] (of the base frame in the map frame)
        initial_velocity: [0.0, 0.0, 0.0] # [m/s] (in the base frame)

      initial_accel_bias: [0.0, 0.0, 0.0] # [m/s^2] (in the IMU frame)
      initial_gyro_bias: [0.0, 0.0, 0.0] # [rad/s] (in the IMU frame)
      hard_iron_bias: [0.0, 0.0, 0.0] # [T] (in the sensor frame)
      # IMPORTANT! The xy delta is seeded from the first range/bearing pair to prevent antipodal trapping.
      origin_delta_position: [0.0, 0.0, 0.0] # [m] (of the neighbor's base frame in the map frame)
      origin_delta_orientation: [0.0, 0.0, 0.0] # [roll, pitch, yaw] [rad] (of the neighbor's base frame in the map frame)

      # If true, forces the initial state covariance to be set by the values below.
      use_parameter_priors_covariance: true
      parameter_priors_covariance:
        initial_position_sigmas: [0.001, 0.001, 0.001] # [m] (in the map frame)
        initial_orientation_sigmas: [0.001, 0.001, 0.001] # [roll, pitch, yaw] [rad] (in the map frame)
        initial_velocity_sigmas: [0.001, 0.001, 0.001] # [m/s] (in the base frame)

      initial_accel_bias_sigmas: [0.01, 0.01, 0.01] # [m/s^2] (in the IMU frame)
      # IMPORTANT! The gravity-aligned component is unobservable with AHRS/mag/GPS off, so this bounds heading drift.
      # SBG Ellipse-N: 7 °/h in-run gyro bias instability.
      # https://support.sbg-systems.com/sc/el/latest/ellipse-documentation/performance-specifications
      initial_gyro_bias_sigmas: [3.4e-5, 3.4e-5, 3.4e-5] # [rad/s] (in the IMU frame)
      # No published SBG hard-iron spec; assumes ~20% of the local field magnitude.
      hard_iron_bias_sigmas: [1.0e-05, 1.0e-05, 1.0e-05] # [T] (in the sensor frame)
      origin_delta_position_sigmas: [1000.0, 1000.0, 1.0e-04] # [m] (in the map frame)
      origin_delta_orientation_sigmas: [1.0e-04, 1.0e-04, 1.0e-04] # [roll, pitch, yaw] [rad] (in the map frame)

    # --- Comparison Methods ---
    comparison:
      # TURTLMap-inspired loosely-coupled DVL preintegration implementation
      enable_loose_dvl_preintegration: false
      # Thoms et al., IEEE JOE 2023 style tightly-coupled DVL preintegration implementation
      enable_tight_dvl_preintegration: false

  dvl_a50_twist_beams_node:
    ros__parameters:
      # --- Node Settings ---
      simulate_dropout: false
      dropout_frequency_hz: 0.033 # [Hz] Frequency of the dropout cycle.
      dropout_duration_sec: 5.0 # [s] Duration of the dropout.

      fom_valid_threshold: 0.01 # [m/s] FOM below this is accepted even if the DVL flags the velocity invalid.
      # TURTLMap-based FOM covariance calculation
      use_fom_covariance: false
      fom_covariance_scale: 4.0 # Scales the FOM into a velocity variance.

      override_timestamp: false # Restamp with ROS receive time if the A50 clock isn't synced.

      # Water Linked DVL A50: 4.4° half-power beam width.
      # https://docs.waterlinked.com/dvl/dvl-a50/
      beam_field_of_view_radians: 0.0768 # [rad] Half-power beam width.
      # Water Linked DVL A50: 5 cm - 50 m altitude range.
      # https://waterlinked.com/dvl-a50
      beam_min_range: 0.05 # [m] Minimum reportable beam distance.
      beam_max_range: 50.0 # [m] Maximum reportable beam distance.

      # --- ROS Topics and Frames ---
      input_topic: "dvl/data"
      twist_output_topic: "dvl/twist"
      beams_output_topic: "dvl/beams"

      beam0_range_topic: "dvl/beam0/range"
      beam1_range_topic: "dvl/beam1/range"
      beam2_range_topic: "dvl/beam2/range"
      beam3_range_topic: "dvl/beam3/range"

      use_parameter_frame: false

  dvl_a50_odom_node:
    ros__parameters:
      # --- Node Settings ---
      override_timestamp: false # Restamp with ROS receive time if the A50 clock isn't synced.

      # Water Linked DVL A50 dead reckoning: 0.1-0.3°/min calibrated yaw drift; no published roll/pitch spec (~1° estimated).
      # https://docs.waterlinked.com/dvl/dead-reckoning/
      orientation_noise_sigmas: [0.01745, 0.01745, 0.03491] # [roll, pitch, yaw] [rad] Orientation uncertainty sigmas.

      # --- ROS Topics and Frames ---
      input_topic: "dvl/position"
      output_topic: "dvl/odometry_ned"

      use_parameter_frame: false

  fluid_pressure_odom_node:
    ros__parameters:
      # --- Node Settings ---
      pressure_scale: 1.0 # Scale factor to convert the input reading to Pascals.
      atmospheric_pressure: 101325.0 # [Pa]
      water_density: 997.0 # [kg/m^3]
      gravity: 9.81 # [m/s^2]

      max_pressure_delta: 0.0 # [Pa] Reject larger jumps as spikes. 0.0 disables rejection.
      max_consecutive_rejections: 5 # Accept the new pressure after this many rejections in a row.

      # --- ROS Topics and Frames ---
      input_topic: "pressure/data"
      output_topic: "depth/odometry"

      calibrate_service: "depth/calibrate" # Sets depth zero ref to the current pressure.

      use_parameter_child_frame: false

  navsat_odom_node:
    ros__parameters:
      # --- Node Settings ---
      publish_diagnostics: true # Publish diagnostic information.

      position_covariance_threshold: 0.0 # [m^2] Max horizontal variance to publish odom. 0.0 disables.

      set_origin: false # Whether this node owns and publishes the ENU origin.
      origin_pub_rate_hz: 1.0 # [Hz] Rate to republish the origin.

      use_parameter_origin: true # Only used if set_origin is true.
      origin_latitude: 40.33940 # [deg]
      origin_longitude: -111.90721 # [deg]
      origin_altitude: 1412.0 # [m]

      # --- ROS Topics and Frames ---
      input_topic: "gps/fix"
      output_topic: "gps/odometry"
      origin_topic: "/origin"

      use_parameter_child_frame: false

  sbg_imu_mag_node:
    ros__parameters:
      # --- Node Settings ---
      # IMPORTANT! This must match the magnitude of factor_graph_node's mag reference_field.
      au_to_tesla: 5.0446e-05

      # --- ROS Topics ---
      input_topic: "imu/mag_au"
      output_topic: "imu/mag"

  seatrac_x150_imu_depth_node:
    ros__parameters:
      # --- Node Settings ---
      # Blueprint Subsea SeaTrac X150 AHRS: ±0.2° pitch/roll, ±1.0° yaw standard deviation.
      # https://www.blueprintsubsea.com/seatrac/seatrac-standard
      orientation_noise_sigmas: [0.00349, 0.00349, 0.01745] # [roll, pitch, yaw] [rad] Orientation uncertainty sigmas.
      # East-positive declination (NOAA convention).
      # https://www.ngdc.noaa.gov/geomag/calculators/magcalc.shtml#declination
      mag_declination_radians: 0.0 # [rad]

      # SeaTrac X150 depth telemetry resolution: 0.1 m (SeaTrac Developer Guide UM-140).
      # https://www.blueprintsubsea.com/seatrac/support
      depth_noise_sigma: 0.1 # [m] Depth sensor Z-position uncertainty sigma.

      # --- ROS Topics and Frames ---
      input_topic: "modem_status"
      imu_output_topic: "seatrac/imu/data_ned"
      depth_output_topic: "seatrac/depth/odometry_ned"

      use_parameter_frame: false

  seatrac_imu_ned_to_enu_node:
    ros__parameters:
      input_topic: "seatrac/imu/data_ned"
      output_topic: "seatrac/imu/data"

  seatrac_odom_ned_to_enu_node:
    ros__parameters:
      input_topic: "seatrac/depth/odometry_ned"
      output_topic: "seatrac/depth/odometry"

  imu_ned_to_enu_node:
    ros__parameters:
      input_topic: "imu/data_ned"
      output_topic: "imu/data"

  odom_ned_to_enu_node:
    ros__parameters:
      input_topic: "dvl/odometry_ned"
      output_topic: "dvl/odometry"

  odom_to_tf_node:
    ros__parameters:
      input_topic: "dvl/odometry"

  gps_to_truth_relay:
    ros__parameters:
      input_topic: "gps/odometry"
      output_topic: "odometry/truth"

  # --- Robot Localization Pipeline ---
  ekf_filter_node_odom:
    ros__parameters:
      frequency: 30.0
      two_d_mode: false
      publish_tf: true
      print_diagnostics: true

      twist0: "dvl/twist"
      twist0_config: [false, false, false, # X, Y, Z
                      false, false, false, # Roll, Pitch, Yaw
                      true,  true,  true,  # Vx, Vy, Vz
                      false, false, false, # Vroll, Vpitch, Vyaw
                      false, false, false] # Ax, Ay, Az
      twist0_queue_size: 5

      imu0: "imu/data"
