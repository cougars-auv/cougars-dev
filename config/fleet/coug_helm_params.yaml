/**:
  bt_helm_node:
    ros__parameters:
      # --- Node Settings ---
      tick_rate_ms: 50 # [ms] Behavior tree tick interval.

      # Waypoint reached if normalized ellipse distance < 1.0 (direct hit).
      capture_radius: [25.0, 2.0] # [m] [horizontal, vertical]
      surface_capture_radius: [1000.0, 0.5] # [m]
      home_capture_radius: [25.0, 0.5] # [m]

      # Waypoint reached if overshoot detected within slip ellipse.
      slip_radius: [50.0, 4.0] # [m] [horizontal, vertical] (typically 2x capture_radius)
      surface_slip_radius: [1000.0, 0.5] # [m]
      home_slip_radius: [50.0, 0.5] # [m]

      desired_speed_rpm: 1500.0 # [RPM] Constant thruster speed to command when moving.
      odom_timeout_sec: 2.0 # [s] Time to wait for odometry before stopping.

      publish_diagnostics: true # Publish diagnostic information.

      # --- Groot2 Connection ---
      publish_groot2: false # Publish behavior tree state to Groot2.
      groot2_port: 1667 # [port] Groot2 publisher port (override per-robot to avoid conflicts).

      # --- ROS Topics ---
      origin_topic: "/origin"
      waypoint_topic: "waypoints"
      odom_topic: "odometry/global"
      hsd_topic: "cmd_hsd"

      start_service: "start"
      stop_service: "stop"
      surface_service: "surface"
      home_service: "home"
