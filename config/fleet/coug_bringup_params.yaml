/**:
  sim_launch:
    ros__parameters:
      scenario_file: "couguv_openwater.json"

  bag_recorder_node:
    ros__parameters:
      publish_diagnostics: true
      bag_record_service: "bag_record"

  ground_segmentation_node:
    ros__parameters:
      maxX: 100.0 # [m]
      minX: -100.0 # [m]
      maxY: 100.0 # [m]
      minY: -100.0 # [m]
      maxZ: 100.0 # [m]
      minZ: -100.0 # [m]
      downsample: true
      downsample_resolution: 0.1 # [m]
      lidar_to_ground: -0.875 # [m] Camera to ground along base frame Z.
      transform_tolerance: 0.1 # [s]

      cellSizeX: 1.0 # [m]
      cellSizeY: 1.0 # [m]
      cellSizeZ: 10.0 # [m] Phase 1 vertical binning.
      cellSizeZPhase2: 1.0 # [m] Phase 2 vertical binning.
      slopeThresholdDegrees: 20.0 # [deg]
      groundInlierThreshold: 0.2 # [m] Must stay below cellSizeZPhase2.
      centroidSearchRadius: 5.0 # [m]
      maxGroundHeightDeviation: 0.1 # [m]
      use_imu_orientation: true

      show_benchmark: false

  rgb_ffmpeg_republish_node:
    ros__parameters:
      in_transport: "raw"
      out_transport: "ffmpeg"

      out:
        ffmpeg:
          # https://github.com/stereolabs/zed-ros2-wrapper/blob/humble-v4.2.x/zed_wrapper/config/ffmpeg.yaml
          bit_rate: 4194304 # [bits/s]
          gop_size: 10 # Frames between keyframes.

  voxblox_node:
    ros__parameters:
      tsdf_voxel_size: 0.05 # [m]
      method: "fast"
