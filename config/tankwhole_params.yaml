/tankwhole:
  coug_description_launch:
    ros__parameters:
      urdf_file: "tankwhole.urdf.xacro"

  "**":
    ros__parameters:
      depth_odom_topic: "/depth/data"

      imu:
        use_parameter_frame: true
        sensor_rate_hz: 333.0 # [Hz] /imu/data
        use_parameter_sigmas: true
        parameter_sigmas:
          # https://docs.clearpathrobotics.com/assets/files/clearpath_robotics_014603-TDS1-8efeae7b74bd54c43ea676651f063dbf.pdf
          accel_noise_density_sigmas: [2.4525e-4, 2.4525e-4, 2.4525e-4] # [x, y, z] [m/s^2/√Hz]
          gyro_noise_density_sigmas: [8.726646e-5, 8.726646e-5, 8.726646e-5] # [x, y, z] [rad/s/√Hz]
        # Gauss-Markov fit K ≈ 2.3 * B / √tau_c at tau_c = 500 s.
        # https://docs.clearpathrobotics.com/assets/files/clearpath_robotics_014603-TDS1-8efeae7b74bd54c43ea676651f063dbf.pdf
        accel_bias_rw_sigmas: [4.04e-5, 4.04e-5, 4.04e-5] # [x, y, z] [m/s^2/√s]
        gyro_bias_rw_sigmas: [3.99e-6, 3.99e-6, 3.99e-6] # [x, y, z] [rad/s/√s]
        gravity: [0.0, 0.0, -9.816] # [x, y, z] [m/s^2] Edinburgh

      gps:
        enable_gps: false
        enable_gps_init_priors: false

      depth:
        use_parameter_frame: true
        use_parameter_sigmas: true

      mag:
        enable_mag: false

      ahrs:
        enable_ahrs: false
        enable_ahrs_init_priors: true
        use_parameter_frame: true
        use_parameter_sigmas: true
        parameter_sigmas:
          # https://docs.clearpathrobotics.com/assets/files/clearpath_robotics_014603-TDS1-8efeae7b74bd54c43ea676651f063dbf.pdf
          orientation_noise_sigmas: [0.00436, 0.00436, 0.01396] # [roll, pitch, yaw] [rad]

      dvl:
        use_parameter_sigmas: true

      beams:
        robust_kernel: "Huber"

      priors:
        use_parameter_priors: false
        use_parameter_priors_sigmas: false
        # https://docs.clearpathrobotics.com/assets/files/clearpath_robotics_014603-TDS1-8efeae7b74bd54c43ea676651f063dbf.pdf
        initial_gyro_bias_sigmas: [6.98e-4, 6.98e-4, 6.98e-4] # [x, y, z] [rad/s]

  dvl_a50_twist_beams_node:
    ros__parameters:
      override_timestamp: true # DVL A50 clock is not synced in these bags

      input_topic: "/dvl/data"

      use_parameter_frame: true

  factor_graph_node:
    ros__parameters:
      ahrs_topic: "imu/data"

  factor_graph_node_vel:
    ros__parameters:
      ahrs_topic: "imu/data"

  factor_graph_node_lpi:
    ros__parameters:
      ahrs_topic: "imu/data"

  factor_graph_node_tpi:
    ros__parameters:
      ahrs_topic: "imu/data"

  fluid_pressure_odom_node:
    ros__parameters:
      ahrs_topic: "imu/data"

  imu_ned_to_enu_node:
    ros__parameters:
      input_topic: "/imu/data"

  navsat_odom_node:
    ros__parameters:
      ahrs_topic: "imu/data"

  ekf_filter_node_map:
    ros__parameters:
      gravitational_acceleration: 9.816 # [m/s^2] Edinburgh

      # IMPORTANT! Handle non-trivial IMU rotation for robot_localization gravity mishandling bug.
      imu0_config: [
          false,
          false,
          false, # X, Y, Z
          false,
          false,
          false, # Roll, Pitch, Yaw
          false,
          false,
          false, # Vx, Vy, Vz
          true,
          true,
          true, # Vroll, Vpitch, Vyaw
          false,
          false,
          false, # Ax, Ay, Az
        ]

      imu1: "imu/data"
      imu1_config: [
          false,
          false,
          false, # X, Y, Z
          true,
          true,
          false, # Roll, Pitch, Yaw
          false,
          false,
          false, # Vx, Vy, Vz
          false,
          false,
          false, # Vroll, Vpitch, Vyaw
          false,
          false,
          false, # Ax, Ay, Az
        ]

      odom0: "/depth/data"

  ekf_filter_node_odom:
    ros__parameters:
      gravitational_acceleration: 9.816 # [m/s^2] Edinburgh

      # IMPORTANT! Handle non-trivial IMU rotation for robot_localization gravity mishandling bug.
      imu0_config: [
          false,
          false,
          false, # X, Y, Z
          false,
          false,
          false, # Roll, Pitch, Yaw
          false,
          false,
          false, # Vx, Vy, Vz
          true,
          true,
          true, # Vroll, Vpitch, Vyaw
          false,
          false,
          false, # Ax, Ay, Az
        ]

  ukf_filter_node_map:
    ros__parameters:
      gravitational_acceleration: 9.816 # [m/s^2] Edinburgh

      # IMPORTANT! Handle non-trivial IMU rotation for robot_localization gravity mishandling bug.
      imu0_config: [
          false,
          false,
          false, # X, Y, Z
          false,
          false,
          false, # Roll, Pitch, Yaw
          false,
          false,
          false, # Vx, Vy, Vz
          true,
          true,
          true, # Vroll, Vpitch, Vyaw
          false,
          false,
          false, # Ax, Ay, Az
        ]

      imu1: "imu/data"
      imu1_config: [
          false,
          false,
          false, # X, Y, Z
          true,
          true,
          false, # Roll, Pitch, Yaw
          false,
          false,
          false, # Vx, Vy, Vz
          false,
          false,
          false, # Vroll, Vpitch, Vyaw
          false,
          false,
          false, # Ax, Ay, Az
        ]

      odom0: "/depth/data"
