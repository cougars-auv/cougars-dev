/**:
  sim_launch:
    ros__parameters:
      agents: ["yboat1gz"]

  coug_gazebo_world_launch:
    ros__parameters:
      world_file: "roboboat.sdf.xacro"

  controller_server:
    ros__parameters:
      FollowPath:
        visualize: true

mapviz:
  ros__parameters:
    default_capture_radius: 0.1 # [m]
    default_capture_radius_z: 0.1 # [m]
    default_slip_radius: 0.1 # [m]
    default_slip_radius_z: 0.1 # [m]

/base_station:
  navsat_odom_node:
    ros__parameters:
      use_parameter_origin: true
      origin_latitude: 27.366056 # [deg]
      origin_longitude: -82.450928 # [deg]
      origin_altitude: 0.0 # [m]

/yboat1gz:
  sim_launch:
    ros__parameters:
      location: [-226.3, 1060.4, 0.0] # [x, y, z] [m]
      rotation: [0.0, 0.0, 180.0] # [roll, pitch, yaw] [deg]

  global_costmap:
    global_costmap:
      ros__parameters:
        publish_frequency: 0.5 # [Hz]
        always_send_full_costmap: true

  local_costmap:
    local_costmap:
      ros__parameters:
        publish_frequency: 5.0 # [Hz]
        always_send_full_costmap: true
