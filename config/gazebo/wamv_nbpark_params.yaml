/**:
  controller_server:
    ros__parameters:
      FollowPath:
        visualize: true

  coug_gazebo_world_launch:
    ros__parameters:
      world_file: "nbpark.sdf.xacro"

  sim_launch:
    ros__parameters:
      agents: ["wamv1gz"]

  imu_filter_madgwick:
    ros__parameters:
      declination: -0.108460 # [rad] WMMHR-2025 (27.3673 N, 82.4511 W, 2027-06-02)

mapviz:
  ros__parameters:
    default_capture_radius: 0.1 # [m]
    default_capture_radius_z: 0.1 # [m]
    default_slip_radius: 0.1 # [m]
    default_slip_radius_z: 0.1 # [m]

/base_station:
  navsat_odom_node:
    ros__parameters:
      use_parameter_origin: true
      origin_latitude: 27.367256 # [deg]
      origin_longitude: -82.451120 # [deg]
      origin_altitude: 0.0 # [m]

/wamv1gz:
  sim_launch:
    ros__parameters:
      location: [0.0, 0.0, 0.0] # [x, y, z] [m]
      rotation: [0.0, 0.0, 90.0] # [roll, pitch, yaw] [deg]

  global_costmap:
    global_costmap:
      ros__parameters:
        publish_frequency: 0.5 # [Hz]
        always_send_full_costmap: true

  local_costmap:
    local_costmap:
      ros__parameters:
        publish_frequency: 5.0 # [Hz]
        always_send_full_costmap: true
