/**:
  coug_gazebo_world_launch:
    ros__parameters:
      world_file: "urc.sdf.xacro"

  coug_terrain_launch:
    ros__parameters:
      dem_file: "urc_usgs3dep_1m.vrt"

  sim_launch:
    ros__parameters:
      agents: ["rover1gz"]

  imu_filter_madgwick:
    ros__parameters:
      declination: 0.175077 # [rad] WMMHR-2025 (38.4180 N, 110.7770 W, 2027-06-02)

mapviz:
  ros__parameters:
    default_capture_radius: 0.1 # [m]
    default_capture_radius_z: 0.1 # [m]
    default_slip_radius: 0.1 # [m]
    default_slip_radius_z: 0.1 # [m]

/base_station:
  navsat_odom_node:
    ros__parameters:
      use_parameter_origin: true
      origin_latitude: 38.418 # [deg]
      origin_longitude: -110.777 # [deg]
      origin_altitude: 1394.024 # [m]

/rover1gz:
  sim_launch:
    ros__parameters:
      location: [50.0, -100.0, 0.99] # [x, y, z] [m]
      rotation: [0.0, 0.0, 0.0] # [roll, pitch, yaw] [deg]

  global_costmap:
    global_costmap:
      ros__parameters:
        publish_frequency: 0.5 # [Hz]
        always_send_full_costmap: true

  local_costmap:
    local_costmap:
      ros__parameters:
        publish_frequency: 5.0 # [Hz]
        always_send_full_costmap: true
