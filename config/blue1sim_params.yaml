/blue1sim:
  coug_description_launch:
    ros__parameters:
      urdf_file: "bluerov2_holoocean.urdf.xacro"

  "**":
    ros__parameters:
      publish_velocity_cov: true
      publish_imu_bias_cov: true

      base:
        use_parameter_tf: false
        parameter_tf:
          position: [0.0, 0.1, 0.1]
          orientation: [0.0, 0.0, 0.0, 1.0]

      imu:
        use_parameter_tf: false
        parameter_tf:
          position: [0.11, 0.1, 0.165]
          orientation: [1.0, 0.0, 0.0, 0.0]

      gps:
        enable_gps: false
        use_parameter_tf: false
        parameter_tf:
          position: [0.0, 0.1, 0.1]
          orientation: [0.0, 0.0, 0.0, 1.0]

      depth:
        use_parameter_tf: false
        parameter_tf:
          position: [-0.17, 0.1, 0.16]
          orientation: [0.0, 0.0, 0.0, 1.0]

      mag:
        use_parameter_tf: false
        parameter_tf:
          position: [0.11, 0.1, 0.165]
          orientation: [1.0, 0.0, 0.0, 0.0]

      ahrs:
        use_parameter_tf: false
        parameter_tf:
          position: [0.11, 0.1, 0.165]
          orientation: [1.0, 0.0, 0.0, 0.0]

      dvl:
        use_parameter_tf: false
        parameter_tf:
          position: [0.0, 0.0, 0.0]
          orientation: [0.0, 0.0, 0.0, 1.0]

      dynamics:
        use_parameter_tf: false
        parameter_tf:
          position: [0.0, 0.1, 0.1]
          orientation: [0.0, 0.0, 0.0, 1.0]
        mass: [11.5, 11.5, 11.5]
        linear_drag: [11.5, 11.5, 11.5]
        quad_drag: [1.8, 1.8, 1.8]

      prior:
        parameter_priors:
          initial_position_sigmas: [0.001, 0.001, 1.0]

  global_costmap:
    global_costmap:
      ros__parameters:
        global_frame: "map"
        robot_base_frame: "blue1sim/base_link"

  local_costmap:
    local_costmap:
      ros__parameters:
        global_frame: "blue1sim/odom"
        robot_base_frame: "blue1sim/base_link"
