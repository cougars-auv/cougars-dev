/rover:
  coug_description_launch:
    ros__parameters:
      urdf_file: "rover.urdf.xacro"

  imu_filter_madgwick:
    ros__parameters:
      declination: 0.227921 # [rad] WMMHR-2025 (38.1615 N, 122.4546 W, 2026-09-16)

  ekf_filter_node_odom:
    ros__parameters:
      publish_tf: true
      two_d_mode: true

      imu0: "camera/imu/data_raw"
      # IMPORTANT! Handle non-trivial IMU rotation for robot_localization gravity mishandling bug.
      imu0_config: [
          false,
          false,
          false, # X, Y, Z
          false,
          false,
          false, # Roll, Pitch, Yaw
          false,
          false,
          false, # Vx, Vy, Vz
          true,
          true,
          true, # Vroll, Vpitch, Vyaw
          false,
          false,
          false, # Ax, Ay, Az
        ]

      odom0: "camera/odom"
      odom0_config: [
          true,
          true,
          false, # X, Y, Z
          false,
          false,
          true, # Roll, Pitch, Yaw
          false,
          false,
          false, # Vx, Vy, Vz
          false,
          false,
          false, # Vroll, Vpitch, Vyaw
          false,
          false,
          false, # Ax, Ay, Az
        ]
      odom0_queue_size: 10
      odom0_differential: false
      odom0_relative: false

  ekf_filter_node_map:
    ros__parameters:
      publish_tf: true
      two_d_mode: true

      imu0: "camera/imu/data_raw"
      # IMPORTANT! Handle non-trivial IMU rotation for robot_localization gravity mishandling bug.
      imu0_config: [
          false,
          false,
          false, # X, Y, Z
          false,
          false,
          false, # Roll, Pitch, Yaw
          false,
          false,
          false, # Vx, Vy, Vz
          true,
          true,
          true, # Vroll, Vpitch, Vyaw
          false,
          false,
          false, # Ax, Ay, Az
        ]

      imu1: "camera/imu/data"

      odom2: "camera/odom"
      odom2_config: [
          true,
          true,
          false, # X, Y, Z
          false,
          false,
          true, # Roll, Pitch, Yaw
          false,
          false,
          false, # Vx, Vy, Vz
          false,
          false,
          false, # Vroll, Vpitch, Vyaw
          false,
          false,
          false, # Ax, Ay, Az
        ]
      odom2_queue_size: 10
      odom2_differential: true
      odom2_relative: false

/base_station:
  navsat_odom_node:
    ros__parameters:
      use_parameter_origin: false
