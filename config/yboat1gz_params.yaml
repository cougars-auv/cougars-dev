/yboat1gz:
  coug_comms_base_launch:
    ros__parameters:
      beacon_id: 3

  coug_description_launch:
    ros__parameters:
      urdf_file: "blueboat.urdf.xacro"

  coug_gazebo_agent_launch:
    ros__parameters:
      urdf_file: "blueboat.gazebo.xacro"
      ardupilot_instance: 0
      ardupilot_param_file: "blueboat.param"

  coug_helm_launch:
    ros__parameters:
      tree_file: "behaviors_nav2.xml"

  mavros_node:
    ros__parameters:
      # ArduPilot SITL instance N (ardupilot_instance) listens on TCP 5760 + 10N
      fcu_url: "tcp://127.0.0.1:5760"

  controller_server:
    ros__parameters:
      controller_frequency: 20.0 # [Hz]

      general_goal_checker:
        xy_goal_tolerance: 1.0 # [m] BlueOS WP_RADIUS

      FollowPath:
        transform_tolerance: 0.3 # [s]
        time_steps: 56 # [steps]
        model_dt: 0.05 # [s]
        batch_size: 1000

        motion_model: "DiffDrive"
        vx_max: 1.0 # [m/s] BlueOS WP_SPEED
        vx_min: -0.7 # [m/s]
        wz_max: 0.524 # [rad/s] BlueOS ATC_STR_RAT_MAX (30 deg/s)

        ax_max: 0.7 # [m/s^2] BlueOS ATC_ACCEL_MAX
        ax_min: -1.0 # [m/s^2] BlueOS ATC_DECEL_MAX
        az_max: 0.524 # [rad/s^2] BlueOS ATC_STR_ACC_MAX (30 deg/s^2)

        vx_std: 0.4 # [m/s]
        wz_std: 0.11 # [rad/s]

        prune_distance: 4.0 # [m]

        critics:
          [
            "ConstraintCritic",
            "CostCritic",
            "GoalCritic",
            "GoalAngleCritic",
            "PathAlignCritic",
            "PathAngleCritic",
            "PathFollowCritic",
            "PreferForwardCritic",
            "TwirlingCritic",
          ]

        CostCritic:
          consider_footprint: true

        GoalCritic:
          threshold_to_consider: 3.0 # [m]

        PathAlignCritic:
          offset_from_furthest: 2 # [poses]

        PathAngleCritic:
          cost_weight: 4.0
          offset_from_furthest: 2 # [poses]

        PathFollowCritic:
          cost_weight: 5.0
          offset_from_furthest: 2 # [poses]
          threshold_to_consider: 3.0 # [m]

        PreferForwardCritic:
          cost_weight: 7.5

        TwirlingCritic:
          cost_weight: 5.0

  global_costmap:
    global_costmap:
      ros__parameters:
        update_frequency: 1.0 # [Hz]
        publish_frequency: 0.0 # [Hz]

        footprint: "[[0.6, 0.465], [0.6, -0.465], [-0.6, -0.465], [-0.6, 0.465]]" # BlueBoat 1.2 x 0.93 m
        plugins: ["ground_consistency_layer", "inflation_layer"]

        ground_consistency_layer:
          plugin: "nav2_ground_consistency_costmap_plugin::GroundConsistencyLayer"
          ground_points_topic: "/yboat1gz/ground_segmentation/ground_points"
          nonground_points_topic: "/yboat1gz/ground_segmentation/obstacle_points"

          robot_height: 1.2 # [m]
          max_data_range: 0.0 # [m]
          nonground_prob_thresh: 0.5
          nonground_decay: 0.95

        inflation_layer:
          plugin: "nav2_costmap_2d::InflationLayer"
          inflation_radius: 2.26 # [m]
          cost_scaling_factor: 3.08 # [1/m]

  local_costmap:
    local_costmap:
      ros__parameters:
        update_frequency: 5.0 # [Hz]
        publish_frequency: 1.0 # [Hz]

        footprint: "[[0.6, 0.465], [0.6, -0.465], [-0.6, -0.465], [-0.6, 0.465]]" # BlueBoat 1.2 x 0.93 m
        plugins: ["ground_consistency_layer", "inflation_layer"]

        ground_consistency_layer:
          plugin: "nav2_ground_consistency_costmap_plugin::GroundConsistencyLayer"
          ground_points_topic: "/yboat1gz/ground_segmentation/ground_points"
          nonground_points_topic: "/yboat1gz/ground_segmentation/obstacle_points"

          robot_height: 1.2 # [m]
          # https://github.com/stereolabs/zed-ros2-wrapper/blob/v5.5.0/zed_wrapper/config/zed2i.yaml
          max_data_range: 15.0 # [m]

        inflation_layer:
          plugin: "nav2_costmap_2d::InflationLayer"
          inflation_radius: 1.76 # [m]
          cost_scaling_factor: 4.27 # [1/m]

  planner_server:
    ros__parameters:
      GridBased:
        plugin: "nav2_navfn_planner::NavfnPlanner"

  navsat_odom_node:
    ros__parameters:
      ahrs_topic: "mavros/imu/data"

  ekf_filter_node_map:
    ros__parameters:
      publish_tf: true

      imu0: "mavros/imu/data"
      imu0_config: [
          false,
          false,
          false, # X, Y, Z
          false,
          false,
          false, # Roll, Pitch, Yaw
          false,
          false,
          false, # Vx, Vy, Vz
          true,
          true,
          true, # Vroll, Vpitch, Vyaw
          true,
          true,
          true, # Ax, Ay, Az
        ]

      imu1: "mavros/imu/data"
      imu1_config: [
          false,
          false,
          false, # X, Y, Z
          true,
          true,
          true, # Roll, Pitch, Yaw
          false,
          false,
          false, # Vx, Vy, Vz
          false,
          false,
          false, # Vroll, Vpitch, Vyaw
          false,
          false,
          false, # Ax, Ay, Az
        ]

      odom1_config: [
          true,
          true,
          true, # X, Y, Z
          false,
          false,
          false, # Roll, Pitch, Yaw
          false,
          false,
          false, # Vx, Vy, Vz
          false,
          false,
          false, # Vroll, Vpitch, Vyaw
          false,
          false,
          false, # Ax, Ay, Az
        ]

  ground_segmentation_node:
    ros__parameters:
      lidar_to_ground: -0.31 # [m] 0.15 camera above the deck + 0.16 freeboard
      groundInlierThreshold: 0.05 # [m]
      maxGroundHeightDeviation: 0.05 # [m]
