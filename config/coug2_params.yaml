/coug2:
  coug_description_launch:
    ros__parameters:
      urdf_file: "couguv.urdf.xacro"

  dvl_a50_twist_node:
    ros__parameters:
      use_parameter_frame: true
      override_timestamp: true # DVL A50 clock is not synced in these bags

  dvl_a50_odom_node:
    ros__parameters:
      use_parameter_frame: true
      override_timestamp: true # DVL A50 clock is not synced in these bags

  fluid_pressure_odom_node:
    ros__parameters:
      atmospheric_pressure: 82776.2 # Deer Creek (~1673 m elevation)
      gravity: 9.7969 # Deer Creek (40.42 N, ~1673 m elevation, free-air correction)

      max_pressure_delta: 9780.0 # [Pa] ~1 m depth jump

      use_parameter_child_frame: true

  navsat_odom_node:
    ros__parameters:
      use_parameter_origin: false
      use_parameter_child_frame: true

  seatrac_x150_imu_node:
    ros__parameters:
      # East-positive declination (NOAA convention).
      # https://www.ngdc.noaa.gov/geomag/calculators/magcalc.shtml#declination
      mag_declination_radians: 0.188 # 10.77 degrees

      use_parameter_frame: true

  ekf_filter_node_map:
    ros__parameters:
      publish_tf: true

      odom0: "dvl/odometry"
      odom0_config: [true,  true, false,  # X, Y, Z
                      true,  true,  true,  # Roll, Pitch, Yaw
                      false, false, false, # Vx, Vy, Vz
                      false, false, false, # Vroll, Vpitch, Vyaw
                      false, false, false] # Ax, Ay, Az
      odom0_differential: true

      # odom2: gps/odometry_null
      imu0: "seatrac/imu/data"

/base_station:
  navsat_odom_node:
    ros__parameters:
      use_parameter_origin: false
