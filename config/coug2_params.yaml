/coug2/dvl_a50_twist_node:
  ros__parameters:
    use_parameter_frame: true

/coug2/dvl_a50_odom_node:
  ros__parameters:
    use_parameter_frame: true

/coug2/fluid_pressure_odom_node:
  ros__parameters:
    atmospheric_pressure: 101325.0
    water_density: 997.0
    gravity: 9.81

    use_parameter_frame: true

/coug2/navsat_odom_node:
  ros__parameters:
    use_parameter_origin: false
    use_parameter_child_frame: true

/coug2/seatrac_x150_imu_node:
  ros__parameters:
    accel_noise_sigmas: [0.0078, 0.0078, 0.0078]
    gyro_noise_sigmas: [0.0012, 0.0012, 0.0012]
    orientation_noise_sigmas: [0.00349, 0.00349, 0.01745]
    magnetic_field_noise_sigmas: [0.003, 0.003, 0.003]
    # https://www.ngdc.noaa.gov/geomag/calculators/magcalc.shtml#declination
    mag_declination_radians: 0.188 # 10.77 degrees

    use_parameter_frame: true

/coug2/odom_ned_to_enu_node:
  ros__parameters:
    publish_tf: true

/coug2/ekf_filter_node_map:
  ros__parameters:
    publish_tf: true

    odom0: odometry/dvl
    odom0_config: [true,  true, false,  # X, Y, Z
                    true,  true,  true,  # Roll, Pitch, Yaw
                    false, false, false, # Vx, Vy, Vz
                    false, false, false, # Vroll, Vpitch, Vyaw
                    false, false, false] # Ax, Ay, Az
    odom0_differential: true

    odom2: odometry/gps
    imu0: seatrac/imu/data
