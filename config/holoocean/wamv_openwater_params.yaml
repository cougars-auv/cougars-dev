holoocean_node:
  ros__parameters:
    publish_commands: true
    show_viewport: false
    draw_arrow: false

    relative_path: false
    scenario_path: "/home/ue4/config/holoocean/wamv_openwater.json"

/**:
  sim_launch:
    ros__parameters:
      scenario_file: "wamv_openwater.json"

/base_station:
  navsat_odom_node:
    ros__parameters:
      use_parameter_origin: true

/wamv1holo:
  global_costmap:
    global_costmap:
      ros__parameters:
        publish_frequency: 0.5 # [Hz]
        always_send_full_costmap: true

  local_costmap:
    local_costmap:
      ros__parameters:
        publish_frequency: 5.0 # [Hz]
        always_send_full_costmap: true
