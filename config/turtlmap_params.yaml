/turtlmap:
  coug_description_launch:
    ros__parameters:
      urdf_file: "turtlmap.urdf.xacro"

  "**":
    ros__parameters:
      imu:
        use_parameter_frame: true
        use_parameter_covariance: true
        parameter_covariance:
          accel_noise_sigmas: [0.003878, 0.003878, 0.003878]
          gyro_noise_sigmas: [0.001380, 0.001380, 0.001380]
        accel_bias_rw_sigmas: [0.006204, 0.006204, 0.006204]
        gyro_bias_rw_sigmas: [0.000613, 0.000613, 0.000613]
        gravity: [0.0, 0.0, -9.81]

      gps:
        enable_gps: false

      depth:
        use_parameter_covariance: true
        parameter_covariance:
          position_z_noise_sigma: 0.005

      mag:
        enable_mag: false

      ahrs:
        use_parameter_frame: true
        enable_ahrs: true
        use_parameter_covariance: true
        parameter_covariance:
          orientation_noise_sigmas: [0.00349, 0.00349, 0.01745]

      prior:
        use_parameter_priors: false

  fluid_pressure_odom_node:
    ros__parameters:
      pressure_scale: 100.0 # IMPORTANT! Pressure is in hPa, not Pa
      atmospheric_pressure: 99339.996

      use_parameter_child_frame: true

  dvl_a50_twist_node:
    ros__parameters:
      use_fom_covariance: true
      fom_covariance_scale: 4.0

      use_parameter_frame: true
