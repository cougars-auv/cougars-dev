/turtlmap:
  coug_description_launch:
    ros__parameters:
      urdf_file: "turtlmap.urdf.xacro"

  "**":
    ros__parameters:
      imu:
        use_parameter_frame: true
        use_parameter_covariance: true
        parameter_covariance:
          accel_noise_sigmas: [2.4525e-4, 2.4525e-4, 2.4525e-4] # [m/s^2/√Hz] br2config.yaml
          gyro_noise_sigmas: [8.726646e-5, 8.726646e-5, 8.726646e-5] # [rad/s/√Hz] br2config.yaml
        accel_bias_rw_sigmas: [6.20438876e-3, 6.20438876e-3, 6.20438876e-3] # [m/s^2/√s] br2config.yaml
        gyro_bias_rw_sigmas: [6.1324618e-4, 6.1324618e-4, 6.1324618e-4] # [rad/s/√s] br2config.yaml
        # Derived from the LORD 3DM-GX5-25 in-run bias instabilities (±0.04 mg accel, 8 °/hr gyro).
        # https://www.microstrain.com/inertial-sensors/3dm-gx5-25
        # Gauss-Markov fit K ≈ 2.3 * B / √tau_c at tau_c = 500 s.
        # accel_bias_rw_sigmas: [4.0e-5, 4.0e-5, 4.0e-5] # [m/s^2/√s]
        # gyro_bias_rw_sigmas: [4.0e-6, 4.0e-6, 4.0e-6] # [rad/s/√s]
        integration_covariance: 1.0e-8 # TURTLMap Posegraph.cpp setImuParams()
        gravity: [0.0, 0.0, -9.81007] # [m/s^2] br2config.yaml (g: 9.81007)

      gps:
        enable_gps: false

      depth:
        use_parameter_covariance: true
        parameter_covariance:
          position_z_noise_sigma: 0.005 # [m] TURTLMap PosegraphBackendOnline.cpp addBarometricFactor()

      mag:
        enable_mag: false

      ahrs:
        use_parameter_frame: true
        enable_ahrs: true
        use_parameter_covariance: true
        parameter_covariance:
          # LORD 3DM-GX5-25 EKF attitude: ±0.25° roll/pitch, ±0.8° heading RMS.
          # https://www.microstrain.com/inertial-sensors/3dm-gx5-25
          orientation_noise_sigmas: [0.00436, 0.00436, 0.01396] # [roll, pitch, yaw] [rad]

      priors:
        use_parameter_priors: false
        initial_velocity_sigmas: [0.1, 0.1, 0.1] # [m/s] TURTLMap PosegraphBackendOnline.cpp callbackDVL()
        # Derived from the LORD 3DM-GX5-25 gyro ARW (0.005 °/s/√Hz) and in-run bias instability (8 °/hr).
        # https://www.microstrain.com/inertial-sensors/3dm-gx5-25
        # max(ARW / √T, B); T = initialization_duration_sec.
        initial_gyro_bias_sigmas: [3.9e-5, 3.9e-5, 3.9e-5] # [rad/s]

  ekf_filter_node_odom:
    ros__parameters:
      # IMPORTANT! Handle non-trivial IMU rotation for robot_localization gravity mishandling bug.
      imu0_config: [false, false, false, # X, Y, Z
                    false, false, false, # Roll, Pitch, Yaw
                    false, false, false, # Vx, Vy, Vz
                    true,  true,  true,  # Vroll, Vpitch, Vyaw
                    false, false, false] # Ax, Ay, Az

  fluid_pressure_odom_node:
    ros__parameters:
      pressure_scale: 100.0 # IMPORTANT! Pressure is in hPa, not Pa
      atmospheric_pressure: 99339.996 # [Pa] br2config.yaml (atm_press: 993.39996 hPa)

      use_parameter_child_frame: true

  dvl_a50_twist_node:
    ros__parameters:
      use_fom_covariance: true
      fom_covariance_scale: 4.0

      use_parameter_frame: true
      override_timestamp: true # DVL A50 clock is not synced in these bags
