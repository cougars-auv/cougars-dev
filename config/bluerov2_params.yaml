/bluerov2:
  coug_description_launch:
    ros__parameters:
      urdf_file: "bluerov2.urdf.xacro"

  "**":
    ros__parameters:
      imu:
        use_parameter_covariance: true
        gravity: [0.0, 0.0, -9.7977] # Utah Lake (40.24 N, ~1358 m elevation, free-air correction)

      gps:
        enable_gps: false

      depth:
        use_parameter_covariance: true

      mag:
        # enable_mag: false
        use_parameter_covariance: true

      ahrs:
        # enable_ahrs: true

      priors:
        use_parameter_priors: false

  fluid_pressure_odom_node:
    ros__parameters:
      atmospheric_pressure: 86039.8 # Utah Lake (~1358 m elevation)
      gravity: 9.7977 # Utah Lake (40.24 N, ~1358 m elevation, free-air correction)

      max_pressure_delta: 9780.0 # [Pa] ~1 m depth jump

  navsat_odom_node:
    ros__parameters:
      position_covariance_threshold: 0.001 # IMPORTANT! Using RTK GPS ground truth

      use_parameter_origin: false
      use_parameter_child_frame: true

  ekf_filter_node_map:
    ros__parameters:
      odom2: "gps/odometry_null"

  ukf_filter_node_map:
    ros__parameters:
      odom2: "gps/odometry_null"

/base_station:
  navsat_odom_node:
    ros__parameters:
      use_parameter_origin: false
