/bluerov2:
  coug_description_launch:
    ros__parameters:
      urdf_file: "bluerov2.urdf.xacro"

  "**":
    ros__parameters:
      base:
        use_parameter_tf: false
        parameter_tf:
          position: [0.27161, -0.10886, -0.01984]
          orientation: [1.0, 0.0, 0.0, 0.0]

      imu:
        use_parameter_tf: false
        parameter_tf:
          position: [0.27161, -0.10886, -0.01984]
          orientation: [1.0, 0.0, 0.0, 0.0]
        gravity: [0.0, 0.0, -9.81]

      gps:
        enable_gps: false
        use_parameter_tf: false
        parameter_tf:
          position: [0.15391, 0.09837, -0.42003]
          orientation: [1.0, 0.0, 0.0, 0.0]

      depth:
        use_parameter_tf: false
        parameter_tf:
          position: [0.27161, -0.10886, -0.01984]
          orientation: [1.0, 0.0, 0.0, 0.0]

      mag:
        enable_mag: false
        use_parameter_covariance: true
        use_parameter_tf: false
        parameter_tf:
          position: [0.27161, -0.10886, -0.01984]
          orientation: [1.0, 0.0, 0.0, 0.0]

      ahrs:
        enable_ahrs: true
        use_parameter_tf: false
        parameter_tf:
          position: [0.27161, -0.10886, -0.01984]
          orientation: [1.0, 0.0, 0.0, 0.0]

      dvl:
        use_parameter_tf: false
        parameter_tf:
          position: [0.0, 0.0, 0.0]
          orientation: [0.0, 0.0, 0.0, 1.0]

      dynamics:
        use_parameter_tf: false
        parameter_tf:
          position: [0.27161, -0.10886, -0.01984]
          orientation: [1.0, 0.0, 0.0, 0.0]

      prior:
        use_parameter_priors: false

  fluid_pressure_odom_node:
    ros__parameters:
      atmospheric_pressure: 86039.8 # Utah Lake (~1358 m elevation)
      water_density: 997.0
      gravity: 9.81

      max_pressure_delta: 9780.0 # [Pa] ~1 m depth jump

  navsat_odom_node:
    ros__parameters:
      use_parameter_origin: false
      use_parameter_child_frame: true

  ekf_filter_node_map:
    ros__parameters:
      odom2: "odometry/gps_null"

  ukf_filter_node_map:
    ros__parameters:
      odom2: "odometry/gps_null"

/base_station:
  navsat_odom_node:
    ros__parameters:
      use_parameter_origin: false
