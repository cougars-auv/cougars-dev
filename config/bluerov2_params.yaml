/bluerov2:
  coug_description_launch:
    ros__parameters:
      urdf_file: "bluerov2.urdf.xacro"

  "**":
    ros__parameters:
      imu:
        use_parameter_covariance: true
        parameter_covariance:
          accel_noise_sigmas: [0.0078, 0.0078, 0.0078]
          gyro_noise_sigmas: [0.0012, 0.0012, 0.0012]
        gravity: [0.0, 0.0, -9.81]

      gps:
        enable_gps: false

      depth:
        use_parameter_covariance: true
        parameter_covariance:
          position_z_noise_sigma: 0.02

      mag:
        enable_mag: false
        use_parameter_covariance: true
        parameter_covariance:
          magnetic_field_noise_sigmas: [0.003, 0.003, 0.003]

      ahrs:
        enable_ahrs: true

      prior:
        use_parameter_priors: false

  fluid_pressure_odom_node:
    ros__parameters:
      atmospheric_pressure: 86039.8 # Utah Lake (~1358 m elevation)
      water_density: 997.0
      gravity: 9.81

      max_pressure_delta: 9780.0 # [Pa] ~1 m depth jump

  navsat_odom_node:
    ros__parameters:
      position_covariance_threshold: 0.001 # IMPORTANT! Using RTK GPS ground truth

      use_parameter_origin: false
      use_parameter_child_frame: true

  ekf_filter_node_map:
    ros__parameters:
      odom2: "gps/odometry_null"

  ukf_filter_node_map:
    ros__parameters:
      odom2: "gps/odometry_null"

/base_station:
  navsat_odom_node:
    ros__parameters:
      use_parameter_origin: false
