/bluerov2:
  coug_description_launch:
    ros__parameters:
      urdf_file: "bluerov2.urdf.xacro"

  "**":
    ros__parameters:
      transform_time_offset: 0.3 # [s] Fix for sonar timestamps

      imu:
        use_parameter_sigmas: true

      gps:
        enable_gps: false
        enable_gps_init_priors: false

      depth:
        use_parameter_sigmas: true

      mag:
        # enable_mag: false
        use_parameter_sigmas: true

      # ahrs:
      #   enable_ahrs: true

      dvl:
        use_parameter_sigmas: true

      priors:
        use_parameter_priors: false
        use_parameter_priors_sigmas: false

  dvl_a50_odom_node:
    ros__parameters:
      use_parameter_frame: true

  dvl_a50_twist_beams_node:
    ros__parameters:
      velocity_scale: 0.975 # Speed of sound correction (Utah Lake)

  fluid_pressure_odom_node:
    ros__parameters:
      atmospheric_pressure: 86039.8 # [Pa] Utah Lake (~1358 m elevation)
      max_pressure_delta: 9780.0 # [Pa] ~1 m depth jump

  navsat_odom_node:
    ros__parameters:
      position_covariance_threshold: 0.001 # [m^2] IMPORTANT! Using RTK GPS ground truth

      use_parameter_child_frame: true

  seatrac_x150_imu_depth_node:
    ros__parameters:
      use_parameter_frame: true

  ekf_filter_node_map:
    ros__parameters:
      odom1: "gps/odometry_null"

  ukf_filter_node_map:
    ros__parameters:
      odom1: "gps/odometry_null"
