/wamv1sim:
  coug_comms_base_launch:
    ros__parameters:
      beacon_id: 5

  coug_description_launch:
    ros__parameters:
      urdf_file: "wamv_holoocean.urdf.xacro"

  "**":
    ros__parameters:
      prior:
        parameter_priors:
          initial_position_sigmas: [0.001, 0.001, 1.0] # [x, y, z] [m]

  cmd_vel_converter_node:
    ros__parameters:
      agent_type: "surface_vessel"

  planner_server:
    ros__parameters:
      GridBased:
        plugin: "nav2_navfn_planner::NavfnPlanner"
        tolerance: 1.0

  controller_server:
    ros__parameters:
      progress_checker:
        plugin: "nav2_controller::PoseProgressChecker"
        required_movement_radius: 0.5 # [m]
        required_movement_angle: 0.25 # [rad]
        movement_time_allowance: 15.0 # [s]

      FollowPath:
        plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
        desired_linear_vel: 2.5 # [m/s]
        lookahead_dist: 6.0 # [m] Roughly one hull length ahead
        regulated_linear_scaling_min_radius: 3.5 # [m]
        max_angular_accel: 2.0 # [rad/s^2]

  behavior_server:
    ros__parameters:
      local_frame: "wamv1sim/odom"
      robot_base_frame: "wamv1sim/base_link"

  global_costmap:
    global_costmap:
      ros__parameters:
        global_frame: "map"
        robot_base_frame: "wamv1sim/base_link"
        footprint: "[[2.5, 1.2], [2.5, -1.2], [-2.5, -1.2], [-2.5, 1.2]]"

  local_costmap:
    local_costmap:
      ros__parameters:
        global_frame: "wamv1sim/odom"
        robot_base_frame: "wamv1sim/base_link"
        footprint: "[[2.5, 1.2], [2.5, -1.2], [-2.5, -1.2], [-2.5, 1.2]]"
        width: 30
        height: 30

  modem_converter_node:
    ros__parameters:
      beacon_id: 5
