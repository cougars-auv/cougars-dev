session_name: couguv
start_directory: "~/cougars-dev"
options:
  mouse: on
  # Start every shell in this session - including windows and panes created
  # after load - with an rc file that layers the aliases on top of ~/.bashrc.
  # Sourcing here instead of typing the aliases into each pane keeps them out
  # of the scrollback.
  default-command: |
    bash --rcfile /dev/fd/3 3<<'RC'
    [ -f ~/.bashrc ] && source ~/.bashrc
    pull_all() { for r in $(find ~/cougars-dev -name .git -prune -printf '%h\n'); do b="$(git -C "$r" branch --show-current)"; [ -n "$b" ] || continue; git -C "$r" pull "$1" "$b"; done; }
    alias pull="pull_all origin"
    alias pull-base="pull_all base"
    alias vcs-import="~/cougars-dev/import.sh"
    alias docker-pull="docker compose -f ~/cougars-dev/docker-compose.yaml pull"
    alias build="docker compose -f ~/cougars-dev/docker-compose.yaml run --rm builder"
    alias restart="sudo systemctl restart cougars.service && sudo journalctl -u cougars.service -f"
    alias logs="docker logs -f cougars-runtime-ct"
    RC
windows:
  - window_name: main
    layout: main-vertical
    panes:
      - shell_command:
          - logs
      - shell_command:
          - cmd: build && restart
            enter: false
      - shell_command:
          - cmd: pull-base
            enter: false
