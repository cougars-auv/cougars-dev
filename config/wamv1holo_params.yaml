/wamv1holo:
  coug_comms_base_launch:
    ros__parameters:
      beacon_id: 5

  coug_description_launch:
    ros__parameters:
      urdf_file: "wamv_holoocean.urdf.xacro"

  coug_helm_launch:
    ros__parameters:
      tree_file: "follow_waypoints_nav2_w_aruco.xml"

  "**":
    ros__parameters:
      priors:
        parameter_priors_sigmas:
          initial_position_sigmas: [0.001, 0.001, 1.0] # [x, y, z] [m]

  cmd_vel_converter_node:
    ros__parameters:
      agent_type: "surface_vessel"

  modem_converter_node:
    ros__parameters:
      beacon_id: 5

  ground_segmentation_node:
    ros__parameters:
      lidar_to_ground: -2.17 # [m]

  controller_server:
    ros__parameters:
      controller_frequency: 20.0 # [Hz]

      general_goal_checker:
        xy_goal_tolerance: 2.5 # [m]

      FollowPath:
        plugin: "nav2_mppi_controller::MPPIController"
        transform_tolerance: 0.3 # [s]
        time_steps: 56 # [steps]
        model_dt: 0.05 # [s]
        batch_size: 1000

        motion_model: "DiffDrive"
        vx_max: 1.0 # [m/s]
        vx_min: -0.7 # [m/s]
        vy_max: 0.0 # [m/s]
        wz_max: 3.8 # [rad/s]

        vx_std: 0.4 # [m/s]
        wz_std: 0.8 # [rad/s]

        prune_distance: 6.0 # [m]

        critics:
          [
            "ConstraintCritic",
            "CostCritic",
            "GoalCritic",
            "GoalAngleCritic",
            "PathAlignCritic",
            "PathAngleCritic",
            "PathFollowCritic",
            "PreferForwardCritic",
            "TwirlingCritic",
          ]

        ConstraintCritic:
          cost_weight: 4.0

        CostCritic:
          consider_footprint: true

        GoalCritic:
          threshold_to_consider: 3.0 # [m]

        PathFollowCritic:
          cost_weight: 5.0
          offset_from_furthest: 6 # [poses]
          threshold_to_consider: 3.0 # [m]

        PreferForwardCritic:
          cost_weight: 7.5

  global_costmap:
    global_costmap:
      ros__parameters:
        global_frame: "map"
        robot_base_frame: "wamv1holo/base_link"

        publish_frequency: 0.5 # [Hz]
        always_send_full_costmap: true
        transform_tolerance: 0.3 # [s]

        footprint: "[[2.5, 1.2], [2.5, -1.2], [-2.5, -1.2], [-2.5, 1.2]]"
        plugins:
          ["terrain_layer", "ground_consistency_layer", "inflation_layer"]

        terrain_layer:
          plugin: "nav2_costmap_2d::StaticLayer"
          map_topic: "/wamv1holo/terrain/occupancy"
          subscribe_to_updates: false
          map_subscribe_transient_local: true
          transform_tolerance: 0.5 # [s]

        ground_consistency_layer:
          plugin: "nav2_ground_consistency_costmap_plugin::GroundConsistencyLayer"
          ground_points_topic: "/wamv1holo/ground_segmentation/ground_points"
          nonground_points_topic: "/wamv1holo/ground_segmentation/obstacle_points"
          tf_timeout: 0.1 # [s]

          robot_height: 1.425 # [m]
          min_clearance: 0.1 # [m]

          ground_inc: 1.0
          nonground_inc: 1.5
          max_score: 5000.0
          ground_decay: 0.80
          nonground_decay: 0.93
          nonground_occ_thresh: 6.0
          nonground_prob_thresh: 0.750

          max_data_range: 0.0 # [m]
          discretize_costs: true
          footprint_clearing_enabled: true
          ground_neighbor_search_cells: 0 # [cells]
          enable_kpi_logging: false

        inflation_layer:
          plugin: "nav2_costmap_2d::InflationLayer"
          inflation_radius: 2.0 # [m]
          cost_scaling_factor: 3.0 # [1/m]

  local_costmap:
    local_costmap:
      ros__parameters:
        global_frame: "wamv1holo/odom"
        robot_base_frame: "wamv1holo/base_link"

        update_frequency: 5.0 # [Hz]
        publish_frequency: 5.0 # [Hz]
        always_send_full_costmap: true
        transform_tolerance: 0.3 # [s]

        footprint: "[[2.5, 1.2], [2.5, -1.2], [-2.5, -1.2], [-2.5, 1.2]]"
        plugins: ["ground_consistency_layer", "inflation_layer"]

        ground_consistency_layer:
          plugin: "nav2_ground_consistency_costmap_plugin::GroundConsistencyLayer"
          ground_points_topic: "/wamv1holo/ground_segmentation/ground_points"
          nonground_points_topic: "/wamv1holo/ground_segmentation/obstacle_points"
          tf_timeout: 0.1 # [s]

          robot_height: 1.425 # [m]
          min_clearance: 0.1 # [m]

          ground_inc: 1.0
          nonground_inc: 1.5
          max_score: 5000.0
          ground_decay: 0.80
          nonground_decay: 0.93
          nonground_occ_thresh: 6.0
          nonground_prob_thresh: 0.750

          # https://github.com/stereolabs/zed-ros2-wrapper/blob/v5.4.1/zed_wrapper/config/zed2i.yaml
          max_data_range: 15.0 # [m]
          discretize_costs: true
          footprint_clearing_enabled: true
          ground_neighbor_search_cells: 0 # [cells]
          enable_kpi_logging: false

        inflation_layer:
          plugin: "nav2_costmap_2d::InflationLayer"
          inflation_radius: 3.0 # [m]
          cost_scaling_factor: 2.3 # [1/m]

  planner_server:
    ros__parameters:
      GridBased:
        plugin: "nav2_navfn_planner::NavfnPlanner"
        tolerance: 0.5 # [m]
