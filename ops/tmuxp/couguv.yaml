session_name: couguv
start_directory: "~/cougars-dev"
options:
  mouse: "on"
windows:
  - window_name: main
    layout: tiled
    panes:
      - shell_command:
          - cmd: build && restart
            enter: false
      - shell_command:
          - cmd: pull-base
            enter: false
      - shell_command:
          - logs
