name: ROS 2 Build & Test

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/ros2_build_and_test.yml"
      - "ros2_ws/src/**"
      - "cougars.repos"
  pull_request:
    branches: [ "main" ]
    paths:
      - ".github/workflows/ros2_build_and_test.yml"
      - "ros2_ws/src/**"
      - "cougars.repos"
  repository_dispatch:
    types: [ ros2_dispatch ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKER_IMAGE: snelsondurrant/cougars:base

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ ubuntu-24.04, ubuntu-24.04-arm ]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ github.repository }}-${{ matrix.runner }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ github.repository }}-${{ matrix.runner }}-
      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}
      - uses: ros-industrial/industrial_ci@master
        env:
          DOCKER_IMAGE: ${{ env.DOCKER_IMAGE }}
          DOCKER_PULL: true
          UPSTREAM_WORKSPACE: cougars.repos
          TARGET_WORKSPACE: ros2_ws
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          BASEDIR: ${{ github.workspace }}/.work
          TARGET_CMAKE_ARGS: >
            -DCMAKE_BUILD_TYPE=${{ matrix.runner == 'ubuntu-24.04' && 'Debug' ||
            'Release' }} -DCMAKE_CXX_FLAGS="${{ matrix.runner == 'ubuntu-24.04'
            && '--coverage' || '' }}" -DCMAKE_C_FLAGS="${{ matrix.runner ==
            'ubuntu-24.04' && '--coverage' || '' }}"
          AFTER_SETUP_UPSTREAM_WORKSPACE: |
            git config --global --add safe.directory "*"
            vcs custom -n --git --args submodule update --init --recursive
      - if: matrix.runner == 'ubuntu-24.04'
        continue-on-error: true
        run: |
          sudo apt-get update && sudo apt-get install -y lcov python3-coverage
          BUILD_DIR="${{ github.workspace }}/.work/target_ws/build"
          SRC_DIR="${{ github.workspace }}/.work/target_ws/src"
          REPO_PATH="${{ github.workspace }}/ros2_ws/src"
          lcov --capture --directory "$BUILD_DIR" --output-file coverage.info --ignore-errors mismatch,gcov,source,empty
          lcov --remove coverage.info '/usr/*' '/opt/*' '*/test/*' '*/tests/*' '*/install/*' '*/build/*' --output-file coverage.info --ignore-errors mismatch,gcov,unused,empty
          sed -i "s|$SRC_DIR|$REPO_PATH|g" coverage.info
          covs=$(find "$BUILD_DIR" -maxdepth 2 -name .coverage 2>/dev/null || true)
          if [ -n "$covs" ]; then
            export COVERAGE_FILE="${{ github.workspace }}/.coverage"
            cd "$SRC_DIR"
            python3 -m coverage combine --keep $covs
            python3 -m coverage xml -o "${{ github.workspace }}/coverage-py.xml" --ignore-errors --omit='/usr/*,/opt/*,*/test/*,*/tests/*,*/install/*,*/build/*,*/setup.py'
            sed -i "s|$SRC_DIR|$REPO_PATH|g" "${{ github.workspace }}/coverage-py.xml"
          fi
      - if: matrix.runner == 'ubuntu-24.04'
        uses: codecov/codecov-action@v6
        with:
          files: coverage.info,coverage-py.xml
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
