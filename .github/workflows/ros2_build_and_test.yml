name: ROS 2 Build & Test

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/ros2_build_and_test.yml"
      - "ros2_ws/src/**"
      - "cougars.repos"
      - "base.repos"
  pull_request:
    branches: [ "main" ]
    paths:
      - ".github/workflows/ros2_build_and_test.yml"
      - "ros2_ws/src/**"
      - "cougars.repos"
      - "base.repos"
  repository_dispatch:
    types: [ ros2_dispatch ]
  workflow_dispatch:

env:
  DOCKER_IMAGE: frostlab/cougars:base-latest

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ ubuntu-24.04, ubuntu-24.04-arm ]
        target: [ cougars, base ]
        include:
          - target: cougars
            repos: "cougars.repos"
          - target: base
            repos: "cougars.repos base.repos"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ github.repository }}-${{ matrix.runner }}-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ github.repository }}-${{ matrix.runner }}-${{ matrix.target }}-
      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}
      - uses: ros-industrial/industrial_ci@master
        env:
          DOCKER_IMAGE: ${{ env.DOCKER_IMAGE }}
          DOCKER_PULL: true
          UPSTREAM_WORKSPACE: ${{ matrix.repos }}
          TARGET_WORKSPACE: ros2_ws
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          BASEDIR: ${{ github.workspace }}/.work
          TARGET_CMAKE_ARGS: >
            -DCMAKE_BUILD_TYPE=Debug
            -DCMAKE_CXX_FLAGS="--coverage"
            -DCMAKE_C_FLAGS="--coverage"
          AFTER_SETUP_UPSTREAM_WORKSPACE: |
            git config --global --add safe.directory "*"
            vcs custom -n --git --args submodule update --init --recursive
      - if: matrix.runner == 'ubuntu-24.04'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
