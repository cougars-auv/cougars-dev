name: ROS 2 Build & Test

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/ros2_build_and_test.yml"
      - "ros2_ws/src/**"
      - "cougars.repos"
  pull_request:
    branches: [ "main" ]
    paths:
      - ".github/workflows/ros2_build_and_test.yml"
      - "ros2_ws/src/**"
      - "cougars.repos"
  repository_dispatch:
    types: [ ros2_dispatch ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKER_IMAGE: frostlab/cougars:base-latest

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ ubuntu-24.04, ubuntu-24.04-arm ]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ github.repository }}-${{ matrix.runner }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ github.repository }}-${{ matrix.runner }}-
      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}
      - uses: ros-industrial/industrial_ci@master
        env:
          DOCKER_IMAGE: ${{ env.DOCKER_IMAGE }}
          DOCKER_PULL: true
          UPSTREAM_WORKSPACE: cougars.repos
          TARGET_WORKSPACE: ros2_ws
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          BASEDIR: ${{ github.workspace }}/.work
          TARGET_CMAKE_ARGS: >
            -DCMAKE_BUILD_TYPE=${{ matrix.runner == 'ubuntu-24.04' && 'Debug' ||
            'Release' }} -DCMAKE_CXX_FLAGS="${{ matrix.runner == 'ubuntu-24.04'
            && '--coverage' || '' }}" -DCMAKE_C_FLAGS="${{ matrix.runner ==
            'ubuntu-24.04' && '--coverage' || '' }}"
          AFTER_SETUP_UPSTREAM_WORKSPACE: |
            git config --global --add safe.directory "*"
            vcs custom -n --git --args submodule update --init --recursive
      - if: matrix.runner == 'ubuntu-24.04'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
