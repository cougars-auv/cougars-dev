name: Docker Build

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*"
  repository_dispatch:
    types: [ docker_dispatch ]
  workflow_dispatch:

env:
  IS_TAG: ${{ github.ref_type == 'tag' }}
  DOCKER_USERNAME: frostlab
  DOCKER_REPO: frostlab/cougars

jobs:
  check-changes:
    runs-on: ubuntu-24.04
    outputs:
      build_gtsam: ${{ steps.decide.outputs.build_gtsam }}
      build_base: ${{ steps.decide.outputs.build_base }}
      build_dev: ${{ steps.decide.outputs.build_dev }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            gtsam:
              - ".github/workflows/docker_build.yml"
              - ".docker/Dockerfile.gtsam"
            base:
              - ".github/workflows/docker_build.yml"
              - ".docker/Dockerfile.base"
              - ".docker/entrypoint.sh"
              - "cougars.repos"
              - "base.repos"
              - "**/package.xml"
            dev:
              - ".github/workflows/docker_build.yml"
              - ".docker/Dockerfile.dev"
      - id: decide
        env:
          IS_DISPATCH: ${{ github.event_name == 'repository_dispatch' }}
          GTSAM: ${{ steps.filter.outputs.gtsam }}
          BASE: ${{ steps.filter.outputs.base }}
          DEV: ${{ steps.filter.outputs.dev }}
        run: |
          build_gtsam=false
          build_base=false
          build_dev=false
          if [ "$IS_DISPATCH" != "true" ] && { [ "$GTSAM" = "true" ] || [ "$IS_TAG" = "true" ]; }; then
            build_gtsam=true
          fi
          if [ "$IS_DISPATCH" = "true" ] || [ "$IS_TAG" = "true" ] || [ "$GTSAM" = "true" ] || [ "$BASE" = "true" ]; then
            build_base=true
          fi
          if [ "$build_base" = "true" ] || [ "$DEV" = "true" ]; then
            build_dev=true
          fi
          {
            echo "build_gtsam=$build_gtsam"
            echo "build_base=$build_base"
            echo "build_dev=$build_dev"
          } >> "$GITHUB_OUTPUT"

  build-gtsam:
    needs: check-changes
    if: needs.check-changes.outputs.build_gtsam == 'true'
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: .docker/Dockerfile.gtsam
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: |
            ${{ env.DOCKER_REPO }}:gtsam-latest-${{ matrix.arch }}
            ${{ env.IS_TAG == 'true' && format('{0}:gtsam-{1}-{2}', env.DOCKER_REPO, github.ref_name, matrix.arch) || '' }}
          provenance: false
          cache-from: type=registry,ref=${{ env.DOCKER_REPO }}:buildcache-gtsam-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.DOCKER_REPO }}:buildcache-gtsam-${{ matrix.arch }},mode=max

  manifest-gtsam:
    needs: build-gtsam
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - run: |
          docker buildx imagetools create -t ${{ env.DOCKER_REPO }}:gtsam-latest \
            ${{ env.DOCKER_REPO }}:gtsam-latest-amd64 \
            ${{ env.DOCKER_REPO }}:gtsam-latest-arm64
          if [ "${{ env.IS_TAG }}" = "true" ]; then
            docker buildx imagetools create -t ${{ env.DOCKER_REPO }}:gtsam-${{ github.ref_name }} \
              ${{ env.DOCKER_REPO }}:gtsam-${{ github.ref_name }}-amd64 \
              ${{ env.DOCKER_REPO }}:gtsam-${{ github.ref_name }}-arm64
          fi

  build-base:
    needs: [ check-changes, build-gtsam, manifest-gtsam ]
    if: ${{ !failure() && !cancelled() && needs.check-changes.outputs.build_base == 'true' }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}
      - run: |
          sudo apt-get update && sudo apt-get install -y python3-pip
          pip3 install --user vcstool
          echo "${HOME}/.local/bin" >> ${GITHUB_PATH}
          vcs import ros2_ws/src < cougars.repos
          vcs import ros2_ws/src < base.repos
          vcs custom -n --git --args submodule update --init --recursive
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: .docker/Dockerfile.base
          platforms: linux/${{ matrix.arch }}
          pull: true
          push: true
          build-args: |
            VERSION=${{ env.IS_TAG == 'true' && github.ref_name || 'latest' }}
          tags: |
            ${{ env.DOCKER_REPO }}:base-latest-${{ matrix.arch }}
            ${{ env.IS_TAG == 'true' && format('{0}:base-{1}-{2}', env.DOCKER_REPO, github.ref_name, matrix.arch) || '' }}
          provenance: false
          cache-from: type=registry,ref=${{ env.DOCKER_REPO }}:buildcache-base-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.DOCKER_REPO }}:buildcache-base-${{ matrix.arch }},mode=max

  manifest-base:
    needs: [ check-changes, build-base ]
    if: ${{ !failure() && !cancelled() && needs.check-changes.outputs.build_base == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - run: |
          docker buildx imagetools create -t ${{ env.DOCKER_REPO }}:base-latest \
            ${{ env.DOCKER_REPO }}:base-latest-amd64 \
            ${{ env.DOCKER_REPO }}:base-latest-arm64
          if [ "${{ env.IS_TAG }}" = "true" ]; then
            docker buildx imagetools create -t ${{ env.DOCKER_REPO }}:base-${{ github.ref_name }} \
              ${{ env.DOCKER_REPO }}:base-${{ github.ref_name }}-amd64 \
              ${{ env.DOCKER_REPO }}:base-${{ github.ref_name }}-arm64
          fi

  build-dev:
    needs: [ check-changes, build-base, manifest-base ]
    if: ${{ !failure() && !cancelled() && needs.check-changes.outputs.build_dev == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: .docker/Dockerfile.dev
          platforms: linux/amd64
          pull: true
          push: true
          build-args: |
            VERSION=${{ env.IS_TAG == 'true' && github.ref_name || 'latest' }}
          tags: |
            ${{ env.DOCKER_REPO }}:dev-latest
            ${{ env.IS_TAG == 'true' && format('{0}:dev-{1}', env.DOCKER_REPO, github.ref_name) || '' }}
          provenance: false
          cache-from: type=registry,ref=${{ env.DOCKER_REPO }}:buildcache-dev-amd64
          cache-to: type=registry,ref=${{ env.DOCKER_REPO }}:buildcache-dev-amd64,mode=max
