name: Docker Build

run-name: ${{ github.event.client_payload.repo }}

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/docker_build.yml"
      - ".docker/**"
      - "*.repos"
      - "**/package.xml"
  repository_dispatch:
    types: [rebuild-images]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOCKER_USERNAME: frostlab
  DOCKER_REPO: frostlab/cougars

jobs:
  build-gtsam:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: .docker/Dockerfile.gtsam
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: |
            ${{ env.DOCKER_REPO }}:gtsam-latest-${{ matrix.arch }}
          provenance: false
          cache-from: type=registry,ref=${{ env.DOCKER_REPO }}:buildcache-gtsam-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.DOCKER_REPO }}:buildcache-gtsam-${{ matrix.arch }},mode=max

  manifest-gtsam:
    needs: build-gtsam
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - run: |
          docker buildx imagetools create -t ${{ env.DOCKER_REPO }}:gtsam-latest \
            ${{ env.DOCKER_REPO }}:gtsam-latest-amd64 \
            ${{ env.DOCKER_REPO }}:gtsam-latest-arm64

  build-runtime:
    needs: manifest-gtsam
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}
      - run: |
          sudo apt-get update && sudo apt-get install -y python3-pip
          pip3 install --user vcstool
          echo "${HOME}/.local/bin" >> ${GITHUB_PATH}
          vcs import ros2_ws/src < runtime.repos
          vcs custom -n --git --args submodule update --init --recursive
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: .docker/Dockerfile.runtime
          platforms: linux/${{ matrix.arch }}
          pull: true
          push: true
          tags: |
            ${{ env.DOCKER_REPO }}:runtime-latest-${{ matrix.arch }}
          provenance: false
          cache-from: type=registry,ref=${{ env.DOCKER_REPO }}:buildcache-runtime-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.DOCKER_REPO }}:buildcache-runtime-${{ matrix.arch }},mode=max

  manifest-runtime:
    needs: build-runtime
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - run: |
          docker buildx imagetools create -t ${{ env.DOCKER_REPO }}:runtime-latest \
            ${{ env.DOCKER_REPO }}:runtime-latest-amd64 \
            ${{ env.DOCKER_REPO }}:runtime-latest-arm64

  build-dev:
    needs: manifest-runtime
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}
      - run: |
          sudo apt-get update && sudo apt-get install -y python3-pip
          pip3 install --user vcstool
          echo "${HOME}/.local/bin" >> ${GITHUB_PATH}
          vcs import ros2_ws/src < runtime.repos
          vcs import ros2_ws/src < dev.repos
          vcs custom -n --git --args submodule update --init --recursive
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: .docker/Dockerfile.dev
          platforms: linux/amd64
          pull: true
          push: true
          tags: |
            ${{ env.DOCKER_REPO }}:dev-latest
          provenance: false
          cache-from: type=registry,ref=${{ env.DOCKER_REPO }}:buildcache-dev-amd64
          cache-to: type=registry,ref=${{ env.DOCKER_REPO }}:buildcache-dev-amd64,mode=max
