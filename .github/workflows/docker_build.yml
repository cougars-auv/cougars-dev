name: Docker Build

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*"
    paths:
      - ".github/workflows/docker_build.yml"
      - ".docker/Dockerfile.gtsam"
      - ".docker/Dockerfile.base"
      - ".docker/Dockerfile.dev"
      - ".docker/entrypoint.sh"
      - "cougars.repos"
      - "**/package.xml"
  repository_dispatch:
    types: [ docker_dispatch ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IS_TAG: ${{ github.ref_type == 'tag' }}
  DOCKER_USERNAME: snelsondurrant
  DOCKER_IMAGE: snelsondurrant/cougars

jobs:
  check-changes:
    runs-on: ubuntu-24.04
    outputs:
      gtsam: ${{ steps.filter.outputs.gtsam }}
      base: ${{ steps.filter.outputs.base }}
      dev: ${{ steps.filter.outputs.dev }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            gtsam:
              - ".github/workflows/docker_build.yml"
              - ".docker/Dockerfile.gtsam"
            base:
              - ".github/workflows/docker_build.yml"
              - ".docker/Dockerfile.base"
              - ".docker/entrypoint.sh"
              - "cougars.repos"
              - "**/package.xml"
            dev:
              - ".github/workflows/docker_build.yml"
              - ".docker/Dockerfile.dev"

  build-gtsam:
    needs: check-changes
    if: |
      github.event_name != 'repository_dispatch' &&
      (needs.check-changes.outputs.gtsam == 'true' || github.ref_type == 'tag')
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: .docker/Dockerfile.gtsam
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:gtsam-latest-${{ matrix.arch }}
            ${{ env.IS_TAG == 'true' && format('{0}:gtsam-{1}-{2}', env.DOCKER_IMAGE, github.ref_name, matrix.arch) || '' }}
          provenance: false
          cache-from: |
            type=gha,scope=gtsam-${{ matrix.arch }}
            type=registry,ref=${{ env.DOCKER_IMAGE }}:buildcache-gtsam-${{ matrix.arch }}
          cache-to: |
            type=gha,mode=max,scope=gtsam-${{ matrix.arch }}
            type=registry,ref=${{ env.DOCKER_IMAGE }}:buildcache-gtsam-${{ matrix.arch }},mode=max

  manifest-gtsam:
    needs: build-gtsam
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - run: |
          docker buildx imagetools create -t ${{ env.DOCKER_IMAGE }}:gtsam-latest \
            ${{ env.DOCKER_IMAGE }}:gtsam-latest-amd64 \
            ${{ env.DOCKER_IMAGE }}:gtsam-latest-arm64
          if [ "${{ env.IS_TAG }}" = "true" ]; then
            docker buildx imagetools create -t ${{ env.DOCKER_IMAGE }}:gtsam-${{ github.ref_name }} \
              ${{ env.DOCKER_IMAGE }}:gtsam-${{ github.ref_name }}-amd64 \
              ${{ env.DOCKER_IMAGE }}:gtsam-${{ github.ref_name }}-arm64
          fi

  build-base:
    needs: [ check-changes, build-gtsam, manifest-gtsam ]
    if: |
      !failure() && !cancelled() &&
      (github.event_name == 'repository_dispatch' ||
       github.ref_type == 'tag' ||
       needs.check-changes.outputs.gtsam == 'true' ||
       needs.check-changes.outputs.base == 'true')
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}
      - run: |
          sudo apt-get update && sudo apt-get install -y python3-pip
          pip3 install --user vcstool
          echo "${HOME}/.local/bin" >> ${GITHUB_PATH}
          vcs import ros2_ws/src < cougars.repos
          vcs custom -n --git --args submodule update --init --recursive
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: .docker/Dockerfile.base
          platforms: linux/${{ matrix.arch }}
          pull: true
          push: true
          build-args: |
            VERSION=${{ env.IS_TAG == 'true' && github.ref_name || 'latest' }}
          tags: |
            ${{ env.DOCKER_IMAGE }}:base-latest-${{ matrix.arch }}
            ${{ env.IS_TAG == 'true' && format('{0}:base-{1}-{2}', env.DOCKER_IMAGE, github.ref_name, matrix.arch) || '' }}
          provenance: false
          cache-from: |
            type=gha,scope=base-${{ matrix.arch }}
            type=registry,ref=${{ env.DOCKER_IMAGE }}:buildcache-base-${{ matrix.arch }}
          cache-to: |
            type=gha,mode=max,scope=base-${{ matrix.arch }}
            type=registry,ref=${{ env.DOCKER_IMAGE }}:buildcache-base-${{ matrix.arch }},mode=max

  manifest-base:
    needs: [ check-changes, build-base ]
    if: |
      !failure() && !cancelled() &&
      (github.event_name == 'repository_dispatch' ||
       github.ref_type == 'tag' ||
       needs.check-changes.outputs.gtsam == 'true' ||
       needs.check-changes.outputs.base == 'true')
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - run: |
          docker buildx imagetools create -t ${{ env.DOCKER_IMAGE }}:base-latest \
            ${{ env.DOCKER_IMAGE }}:base-latest-amd64 \
            ${{ env.DOCKER_IMAGE }}:base-latest-arm64
          if [ "${{ env.IS_TAG }}" = "true" ]; then
            docker buildx imagetools create -t ${{ env.DOCKER_IMAGE }}:base-${{ github.ref_name }} \
              ${{ env.DOCKER_IMAGE }}:base-${{ github.ref_name }}-amd64 \
              ${{ env.DOCKER_IMAGE }}:base-${{ github.ref_name }}-arm64
          fi

  build-dev:
    needs: [ check-changes, build-base, manifest-base ]
    if: |
      !failure() && !cancelled() &&
      (github.event_name == 'repository_dispatch' ||
       github.ref_type == 'tag' ||
       needs.check-changes.outputs.gtsam == 'true' ||
       needs.check-changes.outputs.base == 'true' ||
       needs.check-changes.outputs.dev == 'true')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: .docker/Dockerfile.dev
          platforms: linux/amd64
          pull: true
          push: true
          build-args: |
            VERSION=${{ env.IS_TAG == 'true' && github.ref_name || 'latest' }}
          tags: |
            ${{ env.DOCKER_IMAGE }}:dev-latest
            ${{ env.IS_TAG == 'true' && format('{0}:dev-{1}', env.DOCKER_IMAGE, github.ref_name) || '' }}
          provenance: false
          cache-from: |
            type=gha,scope=dev-amd64
            type=registry,ref=${{ env.DOCKER_IMAGE }}:buildcache-dev-amd64
          cache-to: |
            type=gha,mode=max,scope=dev-amd64
            type=registry,ref=${{ env.DOCKER_IMAGE }}:buildcache-dev-amd64,mode=max
