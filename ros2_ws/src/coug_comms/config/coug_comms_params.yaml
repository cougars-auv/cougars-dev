/**:
  coug_comms_base_launch:
    ros__parameters:
      beacon_id: 0

  base_comms_node:
    ros__parameters:
      # --- ROS Topics ---
      start_service: "base/start"
      stop_service: "base/stop"
      surface_service: "base/surface"
      home_service: "base/home"

      publish_diagnostics: false # Publish diagnostic information.
      diagnostic_timeout: 30.0 # [s]

  auv_comms_node:
    ros__parameters:
      # --- Node Settings ---
      service_timeout: 10.0 # [s]

      # --- ROS Topics ---
      start_service: "start"
      stop_service: "stop"
      surface_service: "surface"
      home_service: "home"

      publish_diagnostics: false # Publish diagnostic information.
      diagnostic_timeout: 30.0 # [s]
