auv_cmd_relay_node:
  modem_rec_topic:
    type: string
    default_value: "modem_rec"

  start_service:
    type: string
    default_value: "start"
  stop_service:
    type: string
    default_value: "stop"
  surface_service:
    type: string
    default_value: "surface"
  home_service:
    type: string
    default_value: "home"
  emergency_stop_service:
    type: string
    default_value: "emergency_stop"
  emergency_surface_service:
    type: string
    default_value: "emergency_surface"

  publish_diagnostics:
    type: bool
    default_value: false
  command_history_size:
    type: int
    default_value: 5
