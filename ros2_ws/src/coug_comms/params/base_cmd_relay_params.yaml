base_cmd_relay_node:
  modem_send_topic:
    type: string
    default_value: "modem_send"

  start_service:
    type: string
    default_value: "base/start"
  stop_service:
    type: string
    default_value: "base/stop"
  surface_service:
    type: string
    default_value: "base/surface"
  home_service:
    type: string
    default_value: "base/home"
  emergency_stop_service:
    type: string
    default_value: "base/emergency_stop"
  emergency_surface_service:
    type: string
    default_value: "base/emergency_surface"

  direct_start_service:
    type: string
    default_value: "start"
  direct_stop_service:
    type: string
    default_value: "stop"
  direct_surface_service:
    type: string
    default_value: "surface"
  direct_home_service:
    type: string
    default_value: "home"
  direct_emergency_stop_service:
    type: string
    default_value: "emergency_stop"
  direct_emergency_surface_service:
    type: string
    default_value: "emergency_surface"

  enable_direct_comms:
    type: bool
    default_value: true
  enable_acoustic_comms:
    type: bool
    default_value: true

  publish_diagnostics:
    type: bool
    default_value: false
  command_history_size:
    type: int
    default_value: 5
