base_comms_node:
  start_service:
    type: string
    default_value: "base/start"
  stop_service:
    type: string
    default_value: "base/stop"
  surface_service:
    type: string
    default_value: "base/surface"
  home_service:
    type: string
    default_value: "base/home"

  publish_diagnostics:
    type: bool
    default_value: false
  diagnostic_timeout:
    type: double
    default_value: 30.0
